# Scooter documentation site (GitHub Pages). `just docs` serves it locally and
# .github/workflows/docs.yml builds and deploys on main; the option reference
# under reference/options is generated from the module system at build time and
# never committed.
site_name: Scooter
site_description: A Nix-powered agent platform on Kubernetes
site_url: https://chadac-me.github.io/scooter/
repo_url: https://github.com/chadac-me/scooter
repo_name: chadac-me/scooter

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  # The generated option pages are listed via their directory's .pages file, since
  # mkdocs' own nav cannot glob.
  - awesome-pages

extra_css:
  - assets/options.css
extra_javascript:
  - assets/options.js

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorial:
      - Getting started: getting-started.md
      - Deploying Scooter:
          - Overview: tutorial/deploying/index.md
          - Using the published images: tutorial/deploying/published-images.md
          - Custom images: tutorial/deploying/custom-images.md
      - Customizing skills: tutorial/skills.md
      - Setting up contribs: tutorial/contribs.md
      - Configuring webhooks: tutorial/webhooks.md
      - Writing a contrib:
          - Overview: tutorial/writing-a-contrib/index.md
          - The declaration: tutorial/writing-a-contrib/declaration.md
          - The deployment half: tutorial/writing-a-contrib/deployment.md
          - The broker provider: tutorial/writing-a-contrib/broker.md
          - Agent tools: tutorial/writing-a-contrib/tools.md
          - Skills: tutorial/writing-a-contrib/skills.md
          - The webhook handler: tutorial/writing-a-contrib/webhooks.md
          - The sandbox module: tutorial/writing-a-contrib/sandbox.md
          - UI metadata: tutorial/writing-a-contrib/ui.md
          - Testing and shipping: tutorial/writing-a-contrib/testing.md
  - Features:
      - Overview: features/index.md
      - Conversations & sandboxes: features/conversations.md
      - Skills: features/skills.md
      - Bring your own Claude: features/byoc.md
      - Models: features/models.md
      - Integrations: features/integrations.md
  - Reference:
      - reference/options/index.md
