[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-lib"
version = "0.0.0"
license = "MIT"
description = "Shared library for Scooter's Python services (logging, common config/auth primitives) — service-agnostic, imported by broker/webhooks/scheduler and by contribs"
requires-python = ">=3.11"
dependencies = [
  "pydantic",
  "pydantic-settings",
]

# hatchling auto-detects the `scooter_lib` package (name matches project name).

[tool.pytest.ini_options]
asyncio_mode = "auto"
