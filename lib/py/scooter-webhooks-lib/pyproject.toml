[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-webhooks-lib"
version = "0.0.0"
license = "MIT"
description = "The webhooks extension surface — handler contract and the generic spawn/identity/store building blocks a webhooks handler (in-tree or contrib) composes"
requires-python = ">=3.11"
dependencies = [
  "scooter-lib",
  "scooter-schema",
  "fastapi",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "aiosqlite",
  "asyncpg",
]

# hatchling auto-detects the `scooter_webhooks_lib` package.

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "uses_entry_points: test exercises the real entry-point loader (the autouse stub is skipped for it)",
]
