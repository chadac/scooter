[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-broker-lib"
version = "0.0.0"
license = "MIT"
description = "The broker extension surface — provider/transport/source contracts and reusable building blocks a broker provider (in-tree or contrib) composes"
requires-python = ">=3.11"
dependencies = [
  "scooter-lib",
  "fastapi",
  "httpx",
  "sqlalchemy",
  # The agent-tool surface: a contrib declares tools on a FastMCP server and types
  # against ToolContext/ToolResult here. Unlike pyjwt (removed in #567 because it
  # served ONE integration), this is the surface itself — every tool-bearing contrib
  # needs it. Why: issue #700.
  "fastmcp",
]

# hatchling auto-detects the `scooter_broker_lib` package.

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
