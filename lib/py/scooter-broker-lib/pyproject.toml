[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-broker-lib"
version = "0.0.0"
license = "MIT"
description = "The broker extension surface — provider/transport/source contracts and reusable building blocks a broker provider (in-tree or contrib) composes"
requires-python = ">=3.11"
dependencies = [
  "scooter-lib",
  "fastapi",
  "httpx",
  "pyjwt[crypto]",
]

# hatchling auto-detects the `scooter_broker_lib` package.

[dependency-groups]
# cryptography only for the tests: the GitHub App source signs a real JWT, so
# the guard needs a real RSA key rather than a stubbed signer.
dev = ["pytest", "pytest-asyncio", "cryptography"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
