# @generated by `just db-generate` from the `scooter.db` module option — do not edit.
# Regenerate after a change; CI fails on drift (just db-generate-check).
#
# For each (database, table): the WRITER services and the read-only READER services.
# This is the one reviewable place that records who may write what — schema.sql says
# WHAT the tables are; this says WHO owns them. The DECLARATIONS live next to the
# module that owns each service (modules/*.nix, `scooter.db.<database>`); the
# comments below are rendered from each table's `note`.
#
# Enforcement:
#   - Runtime: assert_database()/assertDatabase() (scooter_schema / @scooter/schema)
#     make a service fail fast if its DSN points at a database it doesn't own.
#   - Per-database code boundary: a service imports only the database module(s) it
#     may touch, so it cannot reference another database's tables.
#   - Manifest integrity: ownership.spec.ts checks this file lists exactly the tables
#     each schema.sql defines, so the spec and the DDL can't silently diverge.
#
# `writers` is a LIST. Most tables have exactly one, but a table with two legitimate
# writers is modelled as such rather than duplicated across databases.

[agent_host]
owner = "agent-host"

[agent_host.tables]
# Asset metadata (bytes on dedicated PVC). Replaces in-memory blob URLs.
conversation_assets        = { writers = ["agent-host"], readers = [] }
# Who wrote the text in each conversation. GET /conversations/{id} serves it to the
# broker, which vends personal credentials only while every author is the owner.
conversation_authors       = { writers = ["agent-host"], readers = [] }
# The conversation event log. Replaces events.jsonl + the NFS mirror. Deliberately NO readers:
# these are full transcripts; the router's grant is table-scoped to `conversations` so it can't
# read them.
conversation_events        = { writers = ["agent-host"], readers = [] }
# Per-user sidebar folders, including each user's built-in Starred and locked folders.
# The router serves the CRUD; agent-host, the database owner, reads folder lifetimes
# for its retention reap.
conversation_folders       = { writers = ["conversation-router"], readers = [] }
# The background-job registry. Was jobs.json on the emptyDir that every rollout wipes.
conversation_jobs          = { writers = ["agent-host"], readers = [] }
# Conversation metadata: the sidebar list + rehydration fields. THREE writers, one table:
# agent-host owns the row; conversation-router INSERTs it at create time, writes
# title/starred for IDLE conversations, claims host_pod on first route, and SELECTs
# the table for GET /conversations; conversation-controller writes `phase` and
# (re)assigns host_pod. A writer implies read, so none are also readers.
# The broker reads it to resolve the conversations its users filed.
conversations              = { writers = ["agent-host", "conversation-router", "conversation-controller"], readers = ["broker"] }
# One account in one system (scooter, github, gitlab, slack, jira), keyed by the
# system's stable id. Every inbound message's sender is one of these.
identities                 = { writers = ["agent-host"], readers = [] }
# Per-user conversation metadata; for now, the folder each user filed it in. The broker reads where its users filed conversations.
user_conversation_metadata = { writers = ["conversation-router"], readers = ["broker"] }
# Per-user opt-outs from deployment hooks marked `userCanDisable`, set in the settings
# page and read when a conversation's bridge is built.
user_hook_settings         = { writers = ["agent-host"], readers = [] }
# Per-user skills authored in the settings page, injected into that user's conversations
# next to the deployment-wide `agent-skills` ConfigMap. agent-host both serves the CRUD
# and reads them at conversation start, so it is the only writer and there are no
# readers: a skill body is user prose about their own repos, not shared config.
user_skills                = { writers = ["agent-host"], readers = [] }

[broker]
owner = "broker"

[broker.tables]
annotations           = { writers = ["broker"], readers = [] }
# Every approval contrib's requests (scooter_broker_lib.approvals), scoped by `contrib`.
approval_requests     = { writers = ["broker"], readers = [] }
permission_requests   = { writers = ["broker"], readers = [] }
sandbox_size          = { writers = ["broker"], readers = [] }
static_share_versions = { writers = ["broker"], readers = [] }
static_shares         = { writers = ["broker"], readers = [] }

[byoc]
owner = "byoc-controller"

[byoc.tables]
remote_agent_devices = { writers = ["byoc-controller"], readers = [] }
# byoc-controller owns session_id; agent-host writes the status/last_seen badge.
remote_agents        = { writers = ["byoc-controller", "agent-host"], readers = [] }

[scheduler]
owner = "scheduler"

[scheduler.tables]
scheduled_tasks        = { writers = ["scheduler"], readers = [] }
task_run_conversations = { writers = ["scheduler"], readers = [] }
task_runs              = { writers = ["scheduler"], readers = [] }

[webhooks]
owner = "webhooks"

[webhooks.tables]
conversation_map  = { writers = ["webhooks"], readers = ["agent-host"] }
# Hidden per-conversation state for contribs. Webhooks reads and writes it;
# agent-host only deletes a conversation's rows when the conversation is removed.
conversation_vars = { writers = ["webhooks", "agent-host"], readers = [] }
pending_messages  = { writers = ["webhooks"], readers = [] }
# Webhooks OWNS this table; agent-host also WRITES it (the conversation link panel).
# Two writers, one table — the same shape as byoc.remote_agents.
# conversation-router READS it (SELECT-only) to enrich the conversation list with link badges.
resource_links    = { writers = ["webhooks", "agent-host"], readers = ["conversation-router"] }
user_identity     = { writers = ["agent-host"], readers = ["webhooks"] }
