[project]
name = "kubenix-agent-manager-webhooks"
version = "0.0.0"
license = "MIT"
description = "Spawn agent conversations from GitHub/GitLab/Jira/Slack threads"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "websockets",  # WS server (FastAPI) + client (claude-bridge proxy to the agent-host)
  "httpx",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "aiosqlite",   # default dev store (SQLite)
  "asyncpg",     # Postgres driver for the durable mapping store (prod)
  "pyjwt[crypto]", # GitHub App token minting for posting responses
  "scooter-schema", # generated SQLAlchemy models for the webhooks database (single source of truth)
  "scooter-lib",    # shared structured-logging convention (lib/py/scooter-lib)
  "scooter-webhooks-lib", # the extension surface: handler registry + mapping store
]

[project.scripts]
agent-webhooks = "webhooks.app:main"

# External packages can contribute handler modules via this entry-point group
# (mirrors the broker's `agent_broker.providers`). scooter_webhooks_lib/registry.py
# scans it at startup; adding a handler never edits the service.
[project.entry-points."scooter_webhooks.handlers"]
# example = "my_pkg.handlers:my_handler"

[tool.setuptools.packages.find]
include = ["webhooks*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
