<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon: the scooter emoji as an inline SVG data: URI. Inlined (not a /favicon.svg
         fetch) so it renders even when a deployer's ingress auth (oauth2-proxy / ALB-OIDC)
         fronts the whole host — there's no separate HTTP request to gate. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B5%3C/text%3E%3C/svg%3E"
    />
    <title>Scooter</title>
    <!-- Apply the persisted theme (or the OS preference for "system"/unset) BEFORE
         first paint, so there's no light->dark flash. Mirrors src/theme.ts exactly;
         kept tiny + dependency-free and inline so it runs ahead of the module bundle. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("scooter-theme");
          var dark =
            m === "dark" ||
            ((m === "system" || m === null) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* localStorage/matchMedia unavailable — default to light. */
        }
      })();
    </script>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
