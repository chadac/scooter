<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scooter Mobile UI Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .demo-container { display: flex; flex-direction: column; gap: 2rem; padding: 2rem; background: #f5f5f5; }
    .demo-frame { border: 2px solid #333; border-radius: 8px; overflow: hidden; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .demo-label { font-weight: 600; margin-bottom: 0.5rem; color: #333; }
    .device-frame { margin: 0 auto; }
    .desktop-frame { width: 1200px; height: 700px; }
    .tablet-frame { width: 768px; height: 600px; }
    .mobile-frame { width: 375px; height: 667px; }
  </style>
</head>
<body>
  <div class="demo-container">
    <div>
      <div class="demo-label">Desktop View (1920x1080) - Sidebars Always Visible</div>
      <div class="demo-frame desktop-frame">
        <iframe src="desktop-view.html" width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
    
    <div>
      <div class="demo-label">Mobile View (375x812) - Default (Sidebars Hidden)</div>
      <div class="demo-frame mobile-frame device-frame">
        <iframe src="mobile-default.html" width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
    
    <div>
      <div class="demo-label">Mobile View - Sidebar Open</div>
      <div class="demo-frame mobile-frame device-frame">
        <iframe src="mobile-sidebar-open.html" width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
    
    <div>
      <div class="demo-label">Mobile View - Right Panel Open</div>
      <div class="demo-frame mobile-frame device-frame">
        <iframe src="mobile-right-panel-open.html" width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
