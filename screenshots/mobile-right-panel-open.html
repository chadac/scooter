<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile - Right Panel Open</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen overflow-hidden">
  <div class="flex h-full flex-col">
    <!-- Header -->
    <header class="flex h-14 items-center justify-between border-b bg-background px-3 relative z-40">
      <div class="flex items-center gap-2">
        <button class="rounded px-2 py-1.5 text-lg hover:bg-gray-100">☰</button>
        <h1 class="text-base font-semibold">S</h1>
      </div>
      <div class="flex items-center gap-2">
        <button class="rounded px-3 py-1.5 text-sm hover:bg-gray-100">⚙️</button>
        <button class="rounded px-2 py-1.5 text-lg hover:bg-gray-100">☰</button>
      </div>
    </header>

    <div class="relative flex-1 overflow-hidden">
      <!-- Semi-transparent backdrop -->
      <div class="absolute inset-0 bg-black/50 z-20"></div>

      <!-- Right Panel - slides in from right -->
      <aside class="absolute right-0 top-0 bottom-0 z-30 flex h-full w-80 max-w-[85vw] flex-col border-l bg-white shadow-2xl">
        <!-- Close button -->
        <div class="flex items-center justify-between border-b p-4">
          <h2 class="font-semibold text-sm">Sandbox & Services</h2>
          <button class="rounded px-2 py-1 text-lg hover:bg-gray-100">✕</button>
        </div>
        
        <!-- Tabs -->
        <div class="border-b flex text-xs">
          <button class="flex-1 border-r px-3 py-2.5 font-medium bg-white">S</button>
          <button class="flex-1 border-r px-3 py-2.5 text-gray-600 hover:bg-gray-50">A</button>
          <button class="flex-1 border-r px-3 py-2.5 text-gray-600 hover:bg-gray-50">Q</button>
          <button class="flex-1 px-3 py-2.5 text-gray-600 hover:bg-gray-50">Sub</button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4">
          <div class="mb-4">
            <div class="text-sm font-semibold mb-2">Sandbox Status</div>
            <div class="rounded border p-3 bg-green-50">
              <div class="flex items-center gap-2 text-sm">
                <span class="text-green-600">●</span>
                <span class="font-medium">Running</span>
              </div>
              <div class="mt-2 text-xs text-gray-600">
                <div>CPU: 2 cores</div>
                <div>Memory: 4Gi</div>
                <div>Uptime: 2h 15m</div>
              </div>
            </div>
          </div>
          
          <div class="mb-4">
            <div class="text-sm font-semibold mb-2">Services</div>
            <div class="text-sm text-gray-500">No services running</div>
            <button class="mt-2 w-full rounded border px-3 py-2 text-sm hover:bg-gray-50">
              + Start Service
            </button>
          </div>
          
          <div>
            <div class="text-sm font-semibold mb-2">Resources</div>
            <div class="space-y-2 text-sm">
              <div class="flex justify-between">
                <span class="text-gray-600">CPU Usage</span>
                <span>12%</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-blue-600 h-2 rounded-full" style="width: 12%"></div>
              </div>
              
              <div class="flex justify-between">
                <span class="text-gray-600">Memory Usage</span>
                <span>1.2Gi / 4Gi</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-blue-600 h-2 rounded-full" style="width: 30%"></div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main content (dimmed behind backdrop) -->
      <main class="h-full overflow-y-auto p-4 bg-gray-50">
        <div class="space-y-4">
          <div class="rounded-lg bg-white p-4 shadow">
            <div class="font-semibold mb-2 text-sm">User</div>
            <div class="text-sm">Can you make the Scooter UI mobile-friendly?</div>
          </div>
          <div class="rounded-lg bg-blue-50 p-4 shadow">
            <div class="font-semibold mb-2 text-sm">Scooter</div>
            <div class="text-sm">I'll add responsive design with hamburger menus...</div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
