<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile - Sidebar Open</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen overflow-hidden">
  <div class="flex h-full flex-col">
    <!-- Header -->
    <header class="flex h-14 items-center justify-between border-b bg-background px-3 relative z-40">
      <div class="flex items-center gap-2">
        <button class="rounded px-2 py-1.5 text-lg hover:bg-gray-100">☰</button>
        <h1 class="text-base font-semibold">S</h1>
      </div>
      <div class="flex items-center gap-2">
        <button class="rounded px-3 py-1.5 text-sm hover:bg-gray-100">⚙️</button>
        <button class="rounded px-2 py-1.5 text-lg hover:bg-gray-100">☰</button>
      </div>
    </header>

    <div class="relative flex-1 overflow-hidden">
      <!-- Semi-transparent backdrop -->
      <div class="absolute inset-0 bg-black/50 z-20"></div>

      <!-- Left Sidebar - slides in from left -->
      <aside class="absolute left-0 top-0 bottom-0 z-30 flex h-full w-64 max-w-[85vw] flex-col border-r bg-white shadow-2xl">
        <!-- Close button -->
        <div class="flex items-center justify-between border-b p-4">
          <h2 class="font-semibold">Conversations</h2>
          <button class="rounded px-2 py-1 text-lg hover:bg-gray-100">✕</button>
        </div>
        
        <div class="p-4">
          <button class="w-full rounded bg-blue-600 px-4 py-2 text-sm text-white hover:bg-blue-700">+ New Conversation</button>
        </div>
        
        <div class="flex-1 overflow-y-auto px-2">
          <div class="mb-1 rounded px-3 py-2 bg-gray-100">
            <div class="font-medium text-sm">Mobile UI Implementation</div>
            <div class="text-xs text-gray-500">2 hours ago</div>
          </div>
          <div class="mb-1 rounded px-3 py-2 hover:bg-gray-50">
            <div class="font-medium text-sm">Fix deployment issue</div>
            <div class="text-xs text-gray-500">Yesterday</div>
          </div>
          <div class="mb-1 rounded px-3 py-2 hover:bg-gray-50">
            <div class="font-medium text-sm">Add authentication</div>
            <div class="text-xs text-gray-500">2 days ago</div>
          </div>
          <div class="mb-1 rounded px-3 py-2 hover:bg-gray-50">
            <div class="font-medium text-sm">Refactor API handlers</div>
            <div class="text-xs text-gray-500">3 days ago</div>
          </div>
        </div>
      </aside>

      <!-- Main content (dimmed behind backdrop) -->
      <main class="h-full overflow-y-auto p-4 bg-gray-50">
        <div class="space-y-4">
          <div class="rounded-lg bg-white p-4 shadow">
            <div class="font-semibold mb-2 text-sm">User</div>
            <div class="text-sm">Can you make the Scooter UI mobile-friendly?</div>
          </div>
          <div class="rounded-lg bg-blue-50 p-4 shadow">
            <div class="font-semibold mb-2 text-sm">Scooter</div>
            <div class="text-sm">I'll add responsive design with hamburger menus...</div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
