name: update-flake-lock

# Weekly `nix flake update` that opens a PR bumping flake.lock, as chadac-bot.
# The job uses its PAT (CHADAC_BOT_TOKEN, in the main-only `chadac-bot`
# environment) because a PR opened by GITHUB_TOKEN triggers no other
# workflows, so ci.yml would never run on the bump.
# `nix flake update` runs here directly so stubs.lock can be regenerated in the
# same tree as the bumped flake.lock.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # weekly, Sunday 00:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    environment: chadac-bot
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v30

      # Pulls expensive closures from the shared cache so the post-update
      # evaluation is fast.
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        id: update
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee /tmp/flake-update.log
          {
            echo 'summary<<FLAKE_UPDATE_EOF'
            sed -n '/Updated input/,$p' /tmp/flake-update.log
            echo 'FLAKE_UPDATE_EOF'
          } >> "$GITHUB_OUTPUT"

      # stubs.lock pins its own nixpkgs and stub-overlay.nix asserts it matches
      # flake.lock, so a bump that skips this fails flake evaluation.
      - name: Regenerate stubs.lock against the bumped nixpkgs
        run: |
          # Both systems explicitly: `gen` defaults to the runner's system alone, and
          # a lock missing aarch64 makes the arm sandbox-os image fail to evaluate.
          nix run github:chadac/nix-stubs#gen -- \
            --flake . --attr stubs \
            --lock modules/sandbox-os/stubs.lock \
            --flake-lock flake.lock \
            --system x86_64-linux --system aarch64-linux

      # Mirrors `just check-flake`; advisory, since CI on the PR is the real gate.
      - name: nix flake show (post-update evaluation sanity)
        continue-on-error: true
        run: nix flake show

      - name: Open the bump PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # PAT so the opened PR triggers ci.yml.
          token: ${{ secrets.CHADAC_BOT_TOKEN }}
          branch: update_flake_lock_action
          delete-branch: true
          title: "chore: update flake.lock"
          commit-message: "chore: update flake.lock"
          labels: |
            dependencies
            automated
          add-paths: |
            flake.lock
            modules/sandbox-os/stubs.lock
          body: |
            Automated weekly `nix flake update`, with
            `modules/sandbox-os/stubs.lock` regenerated against the bumped
            nixpkgs so the flake still evaluates.

            ```
            ${{ steps.update.outputs.summary }}
            ```
