name: CI

# Runs the fast check tier on every PR and on pushes to main:
#   - nix flake show          (flake evaluates)
#   - check-manifests         (example platform config renders, resources present)
#   - typecheck               (agent-host + ui)
#   - unit tests              (vitest against fakes, no cluster)
#   - broker + webhooks builds (their nix build runs pytest via pytestCheckHook)
#
# The KVM-backed dev-env nixosTests run as a parallel MATRIX (one job per VM
# test) below, so they finish in the time of the slowest single test rather than
# 8 serial boots.
#
# Cluster (e2e full + integration): a PATH-GATED k3d job (`cluster-image-boot`) runs the
# self-contained image-boot specs (sandbox-os + overlay-store) on a real cluster
# when the sandbox image / its modules / those specs change — covering the OCI
# packaging + in-pod systemd boot + the local-overlay store's PROD topology that
# the VM tests can't. The rest of the cluster integration suite (controller/broker/
# webhooks) and the e2e suites stay manual — see the `cluster` / `e2e` justfile
# recipes + docs/TESTING.md.
#
# BINARY CACHE (Cachix) — one-time setup so expensive closures (e.g. the
# scooter-module NixOS toplevel) are built ONCE and pulled across branches/PRs
# instead of rebuilt cold per branch:
#   1. Create a cache named `scooter` at https://app.cachix.org (public read).
#   2. Generate a write auth token; add it as the repo secret CACHIX_AUTH_TOKEN.
# Without the secret CI still works — cachix-action pulls read-only (no push),
# so forks/contributors are unaffected; they just don't populate the cache.

on:
  pull_request:
    # `labeled` so adding `flake-check` (or `full-nixos-tests`) to an open PR
    # re-triggers CI and runs the focused flake-repeat job below.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # MERGE QUEUE. Required for the queue to function: GitHub tests each entry on a
  # temporary `gh-readonly-queue/*` ref built from main + the entries ahead of it,
  # and reports the required checks against THAT ref. Without this trigger the
  # checks never run and every queue entry times out.
  #
  # This is what catches a SEMANTIC merge collision — two PRs that touch no common
  # line but disagree about a signature. #318 added a required `owner` argument
  # while #322 (branched earlier) still called the old one: both green, the merge
  # textually clean, and main went red.
  merge_group:
  # Nightly: run the FULL nixosTest set incl. the heavy ones (see HEAVY_TESTS
  # below) that are too slow for per-PR (a ~1h from-source NixOS toplevel build).
  # Also runs the flake-detection job (the whole e2e suite, each test 5×).
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  # Manual trigger (Actions tab) — handy for running the flake-detection job on
  # demand without waiting for the nightly.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fast checks (flake + typecheck + unit + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v30

      # Cachix binary cache: build-once-share-everywhere across branches/PRs, so
      # an expensive closure (e.g. the scooter-module NixOS toplevel) is realised
      # ONCE and pulled thereafter rather than rebuilt cold per branch. With the
      # CACHIX_AUTH_TOKEN secret set it also PUSHES; without it (forks) it still
      # PULLS read-only. See README/docs for creating the `scooter` cache.
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The fast `just ci` bundle, run inside the pinned dev shell (gets `just`,
      # node, npm from the flake). check-flake + check-manifests + typecheck +
      # unit vitest. CI=1 makes vitest use the default (non-verbose) reporter.
      - name: just ci (flake check, typecheck, unit)
        env:
          CI: "1"
        run: nix develop --command just ci

      # Python services: their nix build runs the test suite (pytestCheckHook).
      # Building them here gives PR coverage of the Python services without a
      # separate Python toolchain in CI. Keep in sync with the buildPythonApplication
      # services (broker, webhooks, scheduler, conversation-controller,
      # warm-store-controller).
      #
      # `scheduler` was MISSING from this list despite the "keep in sync" note above,
      # so its suite never ran in CI — which is how a semantic merge collision (#318
      # added a required `owner` arg; #322 branched earlier and called the old
      # signature) landed on main with 8 failing tests and nothing to catch it.
      - name: python service tests (nix build runs pytest)
        run: nix build .#broker .#webhooks .#scheduler .#conversation-controller .#warm-store-controller --print-build-logs

  # Build the OCI images — REQUIRED, always-on. Assembling the nix2container image
  # (its per-layer builds over the whole system closure) is a distinct failure surface
  # the nixosTests never touch (they build the NixOS toplevel, not the image) and the
  # heavier path-gated k3d boot job (`cluster-image-boot`) doesn't gate on. A
  # musl/static path leaking into the layer closure via a lazy-tool `.drv` broke this
  # build while every required check stayed green (the bug that shipped in #95, only
  # caught later at deploy). So build the images here on EVERY PR — including ones that
  # only bump a flake input (e.g. nix-stubs) — so a broken image fails the PR red.
  # Cheap-ish and Cachix-backed; no cluster needed.
  image-build:
    name: build sandbox-os images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Build the sandbox image to completion — forces every layer derivation over the full
      # system closure, so an unrealised/broken closure member fails here. (One image now:
      # the overlay store is always on.)
      - name: nix build .#sandbox-os-image
        run: nix build .#sandbox-os-image --print-build-logs

  # Image-size benchmark: measure every shipped image on the PR and diff it against
  # origin/main, then post a sticky PR comment with the table. A SIGNAL (report-only,
  # never fails the PR) so a closure that balloons is visible before it ships. The
  # baseline is REBUILT from origin/main in this same job — accurate + self-contained;
  # Cachix substitutes the unchanged images, so only what the PR actually changed
  # rebuilds. PR-only (needs a PR to compare against + comment on).
  image-sizes:
    name: image size benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write   # to post/update the sticky size-report comment
    steps:
      - uses: actions/checkout@v5
        with:
          # Need main's history for the worktree baseline build (origin/main).
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # 1. Measure the PR's images (JSON to pr-sizes.json; build logs to stderr).
      - name: measure PR image sizes
        run: ./scripts/image-sizes.sh > pr-sizes.json

      # 2. Measure origin/main's images from a worktree — same measures, same script.
      #    Run the PR's copy of the script against main's FLAKE (copy it in, since main
      #    may predate the script — as it does on this very PR), so the baseline uses
      #    identical measurement logic. Cachix substitutes the unchanged images.
      - name: measure origin/main (baseline) image sizes
        run: |
          set -euo pipefail
          git worktree add --detach ../main-baseline origin/main
          cp scripts/image-sizes.sh ../main-baseline/image-sizes.sh
          ( cd ../main-baseline && ./image-sizes.sh ) > base-sizes.json
          git worktree remove --force ../main-baseline

      # 3. Render the comparison table and post/update the sticky PR comment.
      - name: post size report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ./scripts/image-sizes-diff.sh base-sizes.json pr-sizes.json 5 > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"   # also surface it in the run summary
          # Sticky comment via the REST API (numeric comment ids, unlike the GraphQL
          # node ids `gh pr view` returns): find our prior comment by the marker and
          # PATCH it, else POST a new one.
          marker='<!-- image-size-benchmark -->'
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n1)
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -X PATCH -F body=@report.md >/dev/null
            echo "updated sticky comment ${id}"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@report.md >/dev/null
            echo "created sticky comment"
          fi

  # Enumerate the dev-env-* nixosTests into a matrix so each VM test runs in its
  # OWN parallel job. This generate job is cheap (eval only). By default the
  # HEAVY tests (a ~1h from-source NixOS toplevel build — see HEAVY_TESTS) are
  # EXCLUDED from per-PR runs; they run nightly (schedule) or when a PR carries
  # the `full-nixos-tests` label. The fast tests run on every PR.
  nixos-tests-matrix:
    name: enumerate dev-env nixosTests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    env:
      # Tests too expensive for per-PR (space-separated check names). scooter-module
      # builds a full second nixos-system toplevel from nixos-unstable (~1h cold).
      HEAVY_TESTS: "dev-env-scooter-module"
      # Include heavy tests when: nightly schedule, OR the PR has the label.
      INCLUDE_HEAVY: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-nixos-tests') }}
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - id: list
        name: list dev-env-* checks
        run: |
          set -euo pipefail
          # All dev-env-* check names.
          all=$(nix eval --json --impure --expr '
            let f = builtins.getFlake (toString ./.);
                s = builtins.currentSystem;
                names = builtins.attrNames f.checks.${s};
            in builtins.filter (n: builtins.match "dev-env-.*" n != null) names')
          if [ "$INCLUDE_HEAVY" = "true" ]; then
            tests="$all"
            echo "including heavy tests ($HEAVY_TESTS)"
          else
            # Drop the heavy ones with jq (per-PR fast path).
            tests=$(echo "$all" | jq -c --arg heavy "$HEAVY_TESTS" \
              '($heavy | split(" ")) as $h | [ .[] | select( . as $t | ($h | index($t)) | not ) ]')
            echo "excluding heavy tests ($HEAVY_TESTS) — run nightly or add the 'full-nixos-tests' label"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "matrix: $tests"

  nixos-test:
    name: nixosTest ${{ matrix.test }}
    needs: nixos-tests-matrix
    runs-on: ubuntu-latest
    # Non-required for now (continue-on-error) — promote to required once the
    # KVM-accelerated matrix is confirmed consistently green on the runner.
    continue-on-error: true
    strategy:
      fail-fast: false
      # Cap concurrent VM jobs so we don't exhaust the runner pool; each is a
      # full NixOS VM. Tune up if the org has more runner capacity.
      max-parallel: 4
      matrix:
        test: ${{ fromJSON(needs.nixos-tests-matrix.outputs.tests) }}
    steps:
      - uses: actions/checkout@v5

      # GitHub's standard Linux runners HAVE KVM hardware, but /dev/kvm ships with
      # restrictive group perms — so qemu can't open it and the nixosTest VM
      # silently falls back to TCG software emulation (~6-10x slower; this is why
      # the old serial job took ~1h). Loosen the perms so qemu uses real KVM.
      - name: enable KVM access (else qemu falls back to slow TCG)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: nixbuild/nix-quick-install-action@v30

      # Cachix: the heavy bits (esp. scooter-module's NixOS toplevel closure) are
      # built once and pulled across branches/PRs — so a cold branch doesn't
      # rebuild them from source. Pushes when CACHIX_AUTH_TOKEN is set; pulls
      # read-only otherwise.
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: build ${{ matrix.test }}
        run: nix build ".#checks.x86_64-linux.${{ matrix.test }}" --print-build-logs

  # Decide whether the cluster jobs need to run: only when the sandbox
  # image, its NixOS modules, or the image-boot cluster specs change. Most PRs
  # touch none of these and skip the (heavier) cluster job entirely.
  cluster-changes:
    name: detect sandbox-image changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.image }}
      platform: ${{ steps.filter.outputs.platform }}
      example: ${{ steps.filter.outputs.example }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - 'pkgs/sandbox-os/**'
              - 'modules/sandbox-os/**'
              - 'pkgs/broker-tools/**'
              - 'flake.nix'
              - 'test/cluster/sandbox-os.spec.ts'
              - 'test/cluster/overlay-store.spec.ts'
              - 'test/cluster/scooter-converge.spec.ts'
              # warm /nix/store pool: the warm-seed unit lives in the sandbox image; the
              # round-trip + claim CAS spec is self-contained (only the sandbox-os image).
              - 'test/cluster/warm-store.spec.ts'
              - 'modules/warm-store-controller.nix'
              - 'services/warm-store-controller/**'
              # the .scooter seed lives in the provisioner — a seed change must run the
              # k3d converge/tool-on-PATH spec too.
              - 'services/agent-host/src/session/k8sProvisioner.ts'
              - 'test/support/cluster.ts'
            # Multi-replica PLATFORM topology (Deployment/routing/rollout) — a change here
            # runs the k3d platform smoke (platform comes up + a conversation routes). Kept a
            # SEPARATE filter output so the platform smoke can run without the sandbox-image
            # specs and vice-versa. See ROLLOUT_DRAIN_AND_POD_IP.md.
            example:
              - 'examples/**'
              - 'modules/**'
              - 'flake.nix'
            platform:
              - 'modules/platform.nix'
              - 'modules/conversation-controller.nix'
              - 'services/conversation-controller/**'
              - 'services/conversation-router/**'
              - 'test/cluster/platform-smoke.spec.ts'
              - 'flake.nix'
              # The agent-host side of the SAME multi-replica contract: it writes the
              # Conversation CRs the controller assigns and the router forwards to, and
              # hydrate() adopts them on boot. Without these, a change to conversation
              # ownership/liveness skipped the only job that exercises it on a real
              # cluster — which is how a hydrate that adopted nothing shipped green.
              - 'services/agent-host/src/session/conversationRegistry.ts'
              - 'services/agent-host/src/session/k8sConversationRegistry.ts'
              # The e2e-full BROWSER stories now run in this job, so the things that
              # decide WHAT runs must open the gate too — otherwise a change to the
              # tier mechanism, the cluster project's testMatch, or a spec it selects
              # silently skips the only job that exercises it. A green PR whose
              # platform job says `skipping` is NOT cluster-verified.
              - '.github/workflows/ci.yml'
              - 'playwright.config.ts'
              - 'test/e2e/target.ts'
              # The full-target allowlist IS "what runs": adding/removing a spec there
              # must run the only job that executes it.
              - 'test/e2e/full-specs.json'
              - 'test/e2e/cluster-stories.spec.ts'
              - 'test/e2e/chat-search-filter.spec.ts'
              - 'test/e2e/linked-resources.spec.ts'
              - 'test/e2e/target.ts' # the tier mechanism (was tier.ts — a stale name here kept the gate shut)
              # The full-target ALLOWLIST + shard planner decide exactly what the full job
              # runs — editing them without running the job is how an unverified spec
              # would land in the allowlist. Then every spec the allowlist selects: a
              # changed spec must run on the cluster, not just on the fake stack.
              - 'test/e2e/support/shard-e2e.mjs'
              - 'test/e2e/client-server-identity.spec.ts'
              - 'test/e2e/long-conversation.spec.ts'
              - 'test/e2e/multi-turn-integrity.spec.ts'
              - 'test/e2e/refresh-history.spec.ts'
              - 'test/e2e/revive.spec.ts'
              - 'test/e2e/stop-run.spec.ts'
              - 'test/e2e/tail-rerender.spec.ts'
              # The full-target allowlist + every spec on it: enabling a spec (or editing
              # an enabled one) must run the only job that executes it — otherwise the
              # enablement PR goes green with the new spec never having met a cluster.
              - 'test/e2e/aws-interrupt.spec.ts'
              - 'test/e2e/interrupt-queue-recovery.spec.ts'
              - 'test/e2e/interrupt.spec.ts'
              # target.ts (né tier.ts — #363 renamed it and this filter went stale, so
              # gate-mechanism changes stopped opening the gate) + the allowlist that IS
              # the full project's testMatch + the shard planner that distributes it.
              # The specs the allowlist currently selects — editing one must re-run the
              # only job that executes it.
              - 'test/e2e/live-real-agent.spec.ts'
              - 'test/e2e/fixtures.ts'
              # The full-target allowlist AND every spec on it: editing a listed spec
              # (or the list itself) must run the only job that executes it. The list
              # of files here must stay in sync with test/e2e/full-specs.json.
              - 'test/e2e/full-specs.json'
              - 'test/e2e/client-server-identity.spec.ts'
              - 'test/e2e/cluster-stories.spec.ts'
              - 'test/e2e/component-coverage.spec.ts'
              - 'test/e2e/refresh-history.spec.ts'
              - 'test/e2e/stop-run.spec.ts'
              - 'test/e2e/ui-state-consistency.spec.ts'
              - 'services/agent-host/src/session/ownershipGuard.ts'
              - 'services/agent-host/src/session/manager.ts'
              # The CREATE contract: conversations are created by the ROUTER (a CR write),
              # and the agent-host REFUSES an unknown threadId rather than creating one
              # implicitly. platform-smoke is the only place that exercises create-then-
              # prompt against a real cluster, so a change to either side of that contract
              # — the /agui handler, the management routes, or the two services that spawn
              # conversations — must run it.
              - 'services/agent-host/src/agui/server.ts'
              - 'services/agent-host/src/api/management.ts'
              - 'services/scheduler/scheduler/spawn.py'
              - 'services/webhooks/webhooks/agent_host_client.py'

  # Image-boot cluster tests on a REAL Kubernetes cluster (k3d = k3s in
  # Docker; no root, runs on the standard runner). Covers what the nixosTest VMs
  # cannot: the OCI packaging + the in-pod systemd-PID-1 boot, and the
  # local-overlay store in the PROD topology (baked store as the read-only lower).
  # Path-gated via cluster-changes; only the self-contained image-boot specs run
  # (sandbox-os + overlay-store) — no controller/broker/webhooks needed.
  cluster-image-boot:
    name: cluster image boot (k3d)
    needs: cluster-changes
    if: needs.cluster-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Required: this is the ONLY tier that boots the real OCI image in a pod (the prod
    # container topology — minimal PATH, the .scooter CM mount, the in-pod switch under
    # systemd cgroups). Two bugs shipped green because nothing required exercised it
    # (the sandbox-os-image musl leak; the .scooter seed/converge tool-on-PATH path). A
    # failure here now blocks the PR.
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # k3d needs Docker (present on ubuntu-latest). Get k3d + kubectl from nixpkgs.
      - name: create k3d cluster
        run: |
          nix shell nixpkgs#k3d nixpkgs#kubectl -c k3d cluster create scooter-ci --no-lb --wait
          nix shell nixpkgs#k3d -c k3d kubeconfig merge scooter-ci --kubeconfig-merge-default

      # Build both OS images (Cachix-cached) and stream them straight into the Docker
      # daemon, then import into k3d by NAME. The images are nix2container:
      # `<attr>.copyTo docker-daemon:<name>:<tag>` loads Docker directly with no
      # intermediate tarball (dockerTools' gzipped tar was what ctr's importer used to
      # reject). k3d then imports the now-loaded images by name.
      - name: build + import sandbox image
        run: |
          set -euo pipefail
          # One image now — the overlay store is always on. The overlay-store cluster spec
          # uses this same image (OVERLAY_IMAGE == SANDBOX_OS_IMAGE).
          nix run ".#sandbox-os-image.copyTo" -- docker-daemon:agent-sandbox-os:latest
          nix shell nixpkgs#k3d -c k3d image import agent-sandbox-os:latest -c scooter-ci

      # Run ONLY the two self-contained image-boot specs against the live cluster.
      # `npm install` first (node_modules for vitest + the k8s client), inside the
      # dev shell so node/npm come from the flake.
      - name: image-boot specs
        env:
          RUN_CLUSTER_TESTS: "1"
          CLUSTER_PROVIDER: existing
          SANDBOX_OS_IMAGE: agent-sandbox-os:latest
          OVERLAY_IMAGE: agent-sandbox-os:latest   # same image (overlay always on)
          CI: "1"
        # --no-file-parallelism: run the two specs SEQUENTIALLY. Each boots a
        # privileged systemd-PID-1 pod; two at once on a single-node k3d contend
        # for resources (slow boots → flaky readiness) and share the test
        # namespace. One at a time is reliable and still fast.
        run: nix develop --command bash -c 'npm install && npm run test:cluster -- sandbox-os overlay-store scooter-converge warm-store --no-file-parallelism'

      - name: tear down k3d
        if: always()
        run: nix shell nixpkgs#k3d -c k3d cluster delete scooter-ci || true

  # EXAMPLE VALIDATION on a real k3d apiserver. `just check-manifests` proves the
  # example EVALUATES and wires its features; this proves the YAML it produces is VALID
  # KUBERNETES — server-side dry-run runs the real admission/schema validation, catching a bad
  # field, a malformed probe, or a resource the apiserver rejects. The example is the config
  # the docs tell people to copy, so "it renders" is not a strong enough guarantee.
  #
  # Dry-run, not a deploy: no images are built or pulled (minutes saved), and nothing has to
  # come up — this is a validity check, and the full platform-smoke job below covers runtime.
  example-manifests:
    name: example manifests (k3d dry-run)
    needs: cluster-changes
    if: needs.cluster-changes.outputs.example == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: render the example
        run: nix build .#example-manifests -o example.yaml

      - name: create k3d cluster
        run: |
          nix shell nixpkgs#k3d -c k3d cluster create scooter-example \
            --agents 0 --wait --timeout 180s

      # A dry-run validates against CURRENT cluster state, so anything the manifests' own
      # resources depend on must exist for real first:
      #   - the NAMESPACE every namespaced resource targets (the render creates it, but in a
      #     single dry-run pass it does not exist yet -> "namespaces not found" for all 50+);
      #   - the CRDs whose instances are in the same file (else they fail as unknown kinds).
      # These two applies are the only non-dry-run writes; everything else stays a dry-run.
      - name: install the rendered namespace + CRDs
        run: |
          set -euo pipefail
          nix shell nixpkgs#yq-go nixpkgs#kubectl -c bash -c '
            yq eval-all "select(.kind == \"Namespace\" or .kind == \"CustomResourceDefinition\")" \
              example.yaml > prereqs.yaml
            if [ -s prereqs.yaml ]; then kubectl apply --server-side -f prereqs.yaml; fi
            kubectl get ns
          '

      - name: validate against the apiserver (server-side dry-run)
        run: |
          set -euo pipefail
          # --server-side runs the apiserver's REAL schema + admission validation, unlike a
          # client-side dry-run which only checks local structure. A fresh k3d has no
          # competing field managers, so conflicts here are genuine problems.
          nix shell nixpkgs#kubectl -c kubectl apply --server-side -f example.yaml \
            --dry-run=server 2>&1 | tee dry-run.log
          count=$(grep -c 'serverside-applied' dry-run.log || true)
          echo "== validated ${count} resources =="
          # A render that produced nothing would otherwise "pass" silently.
          if [ "${count}" -lt 20 ]; then
            echo "::error::only ${count} resources validated — the example render looks empty/broken"
            exit 1
          fi

      - name: dump on failure
        if: failure()
        run: |
          nix shell nixpkgs#kubectl -c kubectl get crds -o name || true
          tail -50 dry-run.log || true

      - name: delete cluster
        if: always()
        run: nix shell nixpkgs#k3d -c k3d cluster delete scooter-example || true

  # e2e full is sharded with the SAME distribute -> shard-matrix -> collect shape as
  # e2e fast, so the two suites stay structurally consistent and widening the full
  # allowlist later is a number bump, not a restructure. One shard for now: the k3d
  # setup (~13m) dwarfs the 4-spec test phase (~4m), so more shards would multiply
  # setup to split the small part. Bump E2E_FULL_SHARDS when the test phase outgrows
  # the setup (each shard boots its OWN cluster — that is the price of a shard here).
  e2e-full-distribute:
    name: e2e full distribute (shard)
    needs: cluster-changes
    if: needs.cluster-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_FULL_SHARDS: "1"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      # Weights from the last green full run (best-effort), mirroring e2e fast.
      - name: fetch prior e2e-full report (for weights)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p prior
          run_id=$(gh run list --workflow "${{ github.workflow }}" --branch "${{ github.event.repository.default_branch }}" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "${run_id:-}" ]; then
            gh run download "$run_id" --name e2e-full-report --dir prior 2>/dev/null \
              && echo "downloaded prior e2e-full report from run $run_id" \
              || echo "no e2e-full-report artifact on run $run_id — using committed weights"
          else
            echo "no prior successful run — using committed weights"
          fi

      - id: plan
        name: plan shards
        run: |
          set -euo pipefail
          report=""
          [ -f prior/report.json ] && report="prior/report.json"
          matrix=$(SPEC_SET=full PRIOR_REPORT="$report" SHARDS="$E2E_FULL_SHARDS" node test/e2e/support/shard-e2e.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # PLATFORM SMOKE on a real k3d cluster: deploy the FULL multi-replica platform
  # (agent-host Deployment + conversation-controller + conversation-router, fake agent) and
  # assert it comes up + a conversation ROUTES + is assigned a hostIP. Path-gated on the
  # `platform` filter (topology/controller/router changes) — the class of change that
  # #254/#255/#256 shipped with NO cluster coverage (validated only manually on odin). See
  # todo/docs/ROLLOUT_DRAIN_AND_POD_IP.md.
  e2e-full-shard:
    name: e2e full shard ${{ matrix.shard }}
    needs: [cluster-changes, e2e-full-distribute]
    if: needs.cluster-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one shard failing must not cancel the others (collect reports all)
      matrix: ${{ fromJSON(needs.e2e-full-distribute.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: create k3d cluster
        run: |
          nix shell nixpkgs#k3d nixpkgs#kubectl -c k3d cluster create scooter-ci --no-lb --wait
          nix shell nixpkgs#k3d -c k3d kubeconfig merge scooter-ci --kubeconfig-merge-default

      # Build + import every image the fakeAgent platform-manifests reference, by bare name
      # (registryPrefix "" → local names). nix2container `.copyTo docker-daemon:` loads Docker
      # directly; k3d then imports by name. Cachix-cached so this is mostly download.
      # The Sandbox CRD + controller. Previously unnecessary here BY ACCIDENT: the job
      # set GOOSE_BIN=fake, which also forced a noop provisioner, so nothing ever touched
      # the Sandbox API. Decoupling those flags (so the cluster tier tests a REAL sandbox)
      # made this a hard dependency — without it the apiserver answers a plain-text
      # "404 page not found" and every run ends RUN_ERROR.
      #
      # Same version + assets as test/support/cluster-up.sh installs locally.
      - name: install agent-sandbox controller
        run: |
          set -euo pipefail
          base="https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v0.5.2"
          nix shell nixpkgs#kubectl -c bash -c "
            kubectl apply -f '${base}/sandbox.yaml'
            kubectl apply -f '${base}/extensions.yaml'
            kubectl wait --for=condition=Available deploy --all -n agent-sandbox-system --timeout=180s
          "
      - name: build + import platform images
        run: |
          set -euo pipefail
          # <flake-attr>=<image:tag> — attr names are the flake's, image names are the bare
          # local names the fakeAgent platform-manifests reference (registryPrefix "").
          for img in \
            "agent-host-image=agent-host:latest" \
            "sandbox-os-image=agent-sandbox-os:latest" \
            "conversation-controller-image=conversation-controller:latest" \
            "conversation-router-image=conversation-router:latest" \
            "broker-image=agent-broker:latest" \
            "webhooks-image=agent-webhooks:latest" \
            "ui-image=agent-sandbox-ui:latest"; do
            attr="${img%%=*}"; name="${img#*=}"
            nix run ".#${attr}.copyTo" -- "docker-daemon:${name}"
          done
          nix shell nixpkgs#k3d -c k3d image import \
            agent-host:latest agent-sandbox-os:latest conversation-controller:latest \
            conversation-router:latest agent-broker:latest agent-webhooks:latest \
            agent-sandbox-ui:latest -c scooter-ci

      # Apply the fakeAgent platform manifests, wait for the multi-replica pods, then run the
      # smoke spec (deploy up + conversation routes + hostIP assigned).
      - name: apply platform + smoke
        env:
          RUN_CLUSTER_TESTS: "1"
          CLUSTER_PROVIDER: existing
          CI: "1"
        run: |
          nix shell nixpkgs#kubectl -c bash -c '
            kubectl apply -f "$(nix build .#platform-manifests --no-link --print-out-paths)"
            # MULTI-REPLICA + SPREAD. The default topology (replicas=2, podCap=100) puts every test
            # conversation on ONE pod, so any per-pod-view bug is invisible — which is exactly how the
            # "GET /conversations returns one pod'"'"'s slice" bug reached production. Force podCap=1 so
            # each conversation lands on a DIFFERENT pod, and give the fleet room to spread.
            kubectl -n agent-sandbox set env deployment/conversation-controller CONVERSATION_POD_CAP=1
            kubectl -n agent-sandbox scale deployment/agent-host --replicas=3
            kubectl -n agent-sandbox rollout status deployment/conversation-controller --timeout=180s
            kubectl -n agent-sandbox rollout status deployment/agent-host --timeout=300s
            kubectl -n agent-sandbox rollout status deployment/conversation-router --timeout=180s
            kubectl -n agent-sandbox rollout status deployment/conversation-controller --timeout=180s
          '
          nix develop --command bash -c 'npm install && npm run test:cluster -- platform-smoke --no-file-parallelism'


      # e2e FULL browser stories: the same Playwright specs, against the REAL cluster.
      # This is the seam nothing else covers — test/cluster is curl-only (no UI) and the
      # fast suite never sees a real server, so a bug between them is invisible to both.
      # That is how a client-minted conversation id reached the URL and made scooter
      # unusable while all 122 fast tests passed.
      #
      # Port-forward the `ui` Service (nginx: static build + API proxy, so ONE origin
      # serves both the app and /conversations — exactly the browser's real topology).
      - name: e2e full browser stories (shard ${{ matrix.shard }})
        env:
          E2E_TARGET: full
          E2E_CLUSTER_URL: http://127.0.0.1:8899
          E2E_ROLLOUT_HOOK: http://127.0.0.1:8898
          CI: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "report-full-shard-${{ matrix.shard }}.json"
        run: |
          set -euo pipefail
          # Port-forward the `ui` Service: nginx serving the static build AND proxying the
          # API, so ONE origin answers both the app and /conversations — the browser's real
          # topology, not a test-only arrangement.
          nix shell nixpkgs#kubectl -c kubectl -n agent-sandbox rollout status deployment/ui --timeout=180s
          nix shell nixpkgs#kubectl -c kubectl -n agent-sandbox port-forward svc/ui 8899:8080 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          # CLUSTER SAMPLER: every 15s, the node's Allocated-resources table + the pod
          # list. A sandbox Pending on Insufficient cpu leaves NO trace in pod logs and
          # had rolled out of the events tail by dump time in three straight failures —
          # this keeps the resource timeline of the whole run.
          ( while true; do
              echo "== $(date -u +%H:%M:%S)"
              nix shell nixpkgs#kubectl -c bash -c '
                kubectl get pods -n agent-sandbox -o wide 2>/dev/null | grep -v Completed
                kubectl describe nodes 2>/dev/null | grep -A8 "Allocated resources"' 
              sleep 15
            done >/tmp/cluster-sampler.log 2>&1 ) &
          SAMPLER_PID=$!
          # The rollout/move hook: lets the browser specs disturb the cluster (delete
          # the owner pod mid-run / restart the deployment) — kubectl runs HERE, not
          # in the browser. Activates the reassignment stories.
          nix shell nixpkgs#kubectl -c python3 test/e2e/support/rolloutHook.py 8898 >/tmp/rollout-hook.log 2>&1 &
          HOOK_PID=$!
          trap 'kill "$PF_PID" "$SAMPLER_PID" "$HOOK_PID" 2>/dev/null || true' EXIT
          # Wait on a real GET, not the port bind — the forward accepts before nginx serves.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8899/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8899/ || { echo "the UI never served:"; cat /tmp/pf.log; exit 1; }
          nix develop --command bash -c 'npm install && npx playwright test --project=full --reporter=json,list ${{ matrix.specs }}'

      - name: upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-report-shard-${{ matrix.shard }}
          path: report-full-shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: upload cluster browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            /tmp/pf.log
            /tmp/cluster-sampler.log
            /tmp/rollout-hook.log
          retention-days: 7
      - name: dump platform state on failure
        if: failure()
        run: |
          nix shell nixpkgs#kubectl -c bash -c '
            kubectl -n agent-sandbox get pods,deploy,svc,pvc,conversations -o wide || true
            # describe the not-ready workloads so a Pending pod shows its scheduling reason
            # (Insufficient cpu/mem, an unbindable PVC, a taint, …) — a bare `get` hides it.
            kubectl -n agent-sandbox describe deploy/agent-host || true
            kubectl -n agent-sandbox describe pods -l app=agent-host || true
            kubectl describe nodes || true
            kubectl -n agent-sandbox get sandboxes.agents.x-k8s.io -o wide || true
            kubectl -n agent-sandbox get events --sort-by=.lastTimestamp | tail -120 || true
            kubectl -n agent-sandbox logs -l app=agent-host --tail=300 || true
            kubectl -n agent-sandbox logs -l app=conversation-controller --tail=150 || true
            kubectl -n agent-sandbox logs -l app=conversation-router --tail=150 || true
          '

      - name: tear down k3d
        if: always()
        run: nix shell nixpkgs#k3d -c k3d cluster delete scooter-ci || true

  # The GATE for e2e full: succeeds only when every shard passed; merges the per-shard
  # reports into `e2e-full-report` so the next run's distribute weights by real
  # durations. Mirrors e2e-collect. Skips (not passes) when the path filter skipped
  # the suite — a green PR with this job skipped is NOT cluster-verified.
  e2e-full-collect:
    name: e2e full (k3d)
    needs: [cluster-changes, e2e-full-distribute, e2e-full-shard]
    if: always() && needs.cluster-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: gate on shard results
        env:
          SHARDS_RESULT: ${{ needs.e2e-full-shard.result }}
          DISTRIBUTE_RESULT: ${{ needs.e2e-full-distribute.result }}
        run: |
          set -euo pipefail
          echo "distribute=$DISTRIBUTE_RESULT shards=$SHARDS_RESULT"
          [ "$DISTRIBUTE_RESULT" = "success" ] && [ "$SHARDS_RESULT" = "success" ]

      - name: download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-full-report-shard-*
          path: shard-reports
          merge-multiple: true
        continue-on-error: true

      - name: merge reports → e2e-full-report
        continue-on-error: true
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const dir = "shard-reports";
            let suites = [];
            for (const f of (fs.existsSync(dir) ? fs.readdirSync(dir) : [])) {
              if (!f.endsWith(".json")) continue;
              try { const r = JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")); suites = suites.concat(r.suites || []); } catch {}
            }
            fs.writeFileSync("report.json", JSON.stringify({ suites }));
            console.log("merged " + suites.length + " top-level suites into report.json");
          '

      - name: upload merged e2e-full-report (for next run's shard weights)
        if: needs.e2e-full-shard.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-report
          path: report.json
          retention-days: 14
          if-no-files-found: ignore

  # e2e fast — Playwright through the UI against the fake-agent stack (no
  # cluster/model). SHARDED across N parallel runners (default 4): distribute →
  # e2e-shard (matrix) → e2e-collect (gate). Each shard is its OWN runner with its OWN
  # fresh webServer + /tmp state, so playwright.config's workers:1 (the suite shares
  # one backend) is preserved WITHIN a shard while shards run in parallel — which also
  # cuts flakiness (fewer specs interleaving on shared state per runner). The dev shell
  # provides the Nix-wrapped Playwright browsers (no separate install).

  # Balance the spec FILES into N shards, weighted by per-file runtime — auto-measured
  # from the LAST successful e2e run's Playwright JSON report (downloaded here), with a
  # committed fallback (test/e2e/shard-weights.json). Emits a matrix of {shard, specs}.
  e2e-distribute:
    name: e2e fast distribute (shard)
    runs-on: ubuntu-latest
    env:
      # Shard count — tune here (or override per-run via the workflow env). 4 balances
      # speed vs runner cost for ~19 specs.
      E2E_SHARDS: "4"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      # Pull the newest report.json artifact ("e2e-report") from a prior run of THIS
      # workflow on the default branch, so shard weights reflect real durations. Best-
      # effort: no artifact yet (first run / expired) → the committed fallback is used.
      - name: fetch prior e2e report (for weights)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p prior
          # The most recent successful run of this workflow on the default branch.
          run_id=$(gh run list --workflow "${{ github.workflow }}" --branch "${{ github.event.repository.default_branch }}" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "${run_id:-}" ]; then
            gh run download "$run_id" --name e2e-report --dir prior 2>/dev/null \
              && echo "downloaded prior e2e report from run $run_id" \
              || echo "no e2e-report artifact on run $run_id — using committed weights"
          else
            echo "no prior successful run — using committed weights"
          fi

      - id: plan
        name: plan shards
        run: |
          set -euo pipefail
          report=""
          [ -f prior/report.json ] && report="prior/report.json"
          matrix=$(PRIOR_REPORT="$report" SHARDS="$E2E_SHARDS" node test/e2e/support/shard-e2e.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each shard runs its assigned spec FILES on its own runner + webServer. Emits a
  # per-shard Playwright JSON report (report.json), merged into the weights artifact.
  e2e-shard:
    name: e2e fast shard ${{ matrix.shard }}
    needs: e2e-distribute
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one shard failing must not cancel the others (collect reports all)
      matrix: ${{ fromJSON(needs.e2e-distribute.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Run ONLY this shard's specs; emit a JSON report so a later run's distribute can
      # weight by real durations. PLAYWRIGHT_JSON_OUTPUT_NAME makes the json reporter
      # write to a file (not stdout). pretest:e2e (via npm) builds the agent-host dist.
      - name: e2e fast (shard ${{ matrix.shard }})
        env:
          CI: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "report-shard-${{ matrix.shard }}.json"
        run: nix develop --command bash -c 'npm install && npm run test:e2e -- --reporter=json,list ${{ matrix.specs }}'

      # The per-shard report (always — success OR failure) so the collect job can merge
      # a fresh weights artifact from a fully-green run.
      - name: upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: report-shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      # Traces/videos/screenshots for a failing shard.
      - name: upload shard artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The GATE: succeeds ONLY when every shard passed. On any failure it comments on the
  # PR which shard(s) failed (one sticky comment, updated). Also merges the per-shard
  # reports into a single `e2e-report` artifact so the NEXT run's distribute can weight
  # by real durations (only from a fully-green run, so weights stay clean).
  e2e-collect:
    name: e2e fast (Playwright, fake stack)
    needs: [e2e-distribute, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to post/update the sticky per-shard failure comment
    steps:
      - uses: actions/checkout@v5

      # Merge the per-shard reports into one report.json (only meaningful when all
      # shards ran; a missing one is fine — it just contributes no weights next time).
      - name: download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-report-shard-*
          path: shard-reports
          merge-multiple: true
        continue-on-error: true

      - name: merge reports → e2e-report
        continue-on-error: true
        run: |
          set -euo pipefail
          # Concatenate each shard's `suites` into one report.json shaped like a single
          # Playwright JSON run (the distribute parser only reads `.suites[].file` +
          # per-test durations, so a merged suites array is sufficient).
          node -e '
            const fs = require("fs");
            const dir = "shard-reports";
            let suites = [];
            for (const f of (fs.existsSync(dir) ? fs.readdirSync(dir) : [])) {
              if (!f.endsWith(".json")) continue;
              try { const r = JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")); suites = suites.concat(r.suites || []); } catch {}
            }
            fs.writeFileSync("report.json", JSON.stringify({ suites }));
            console.log("merged " + suites.length + " top-level suites into report.json");
          '

      - name: upload merged e2e-report (for next run's shard weights)
        if: needs.e2e-shard.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: report.json
          retention-days: 14
          if-no-files-found: ignore

      # ONE sticky PR comment reflecting the CURRENT e2e result. On failure it lists the
      # failing shard(s)/specs; on success it RESOLVES a prior failure comment to a green
      # "all pass" (so a fail→fix→pass sequence doesn't leave a stale ❌ sitting there).
      # It never CREATES a fresh comment on green (no noise on an always-green PR) — it
      # only updates one that already exists. Always runs so the green branch can fire.
      - name: comment e2e shard result
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.e2e-distribute.outputs.matrix }}
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
          DISTRIBUTE_RESULT: ${{ needs.e2e-distribute.result }}
          # The per-shard results as JSON (GitHub exposes only the aggregate `result`
          # on `needs`, so we reconstruct per-shard pass/fail from the uploaded report
          # artifacts: a shard with a report + no failing test passed; a shard whose
          # report is missing or has failures failed).
        run: |
          set -euo pipefail
          marker="<!-- e2e-shard-report -->"
          # Is the whole e2e green this run?
          if [ "$SHARDS_RESULT" = "success" ] && [ "$DISTRIBUTE_RESULT" = "success" ]; then
            passed=1
          else
            passed=0
          fi

          # Find our existing sticky comment (if any) up front — on green we only UPDATE
          # it (never create), so a green PR that never failed stays comment-free.
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id" 2>/dev/null || true)

          if [ "$passed" = "1" ]; then
            # GREEN: only resolve a previously-posted failure comment; don't create noise.
            if [ -z "${existing:-}" ] || [ "$existing" = "null" ]; then
              echo "e2e green and no prior sticky comment — nothing to post."
              exit 0
            fi
            printf '%s\n\n### ✅ e2e (Playwright) — all shards pass\n\nEvery shard is green on the latest run.\n' "$marker" > body.md
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$(cat body.md)" >/dev/null
            echo "resolved sticky e2e comment to green"
            exit 0
          fi

          # FAILURE: determine which shards failed and render the detail. A MISSING report
          # means that shard crashed before writing one → failed.
          node -e '
            const fs = require("fs");
            const matrix = JSON.parse(process.env.MATRIX).include;
            const dir = "shard-reports";
            const has = (f) => fs.existsSync(dir + "/" + f);
            const failedTests = (report) => {
              const out = [];
              const walk = (n, file) => {
                if (!n || typeof n !== "object") return;
                file = n.file || file;
                for (const spec of n.specs || []) {
                  const sf = spec.file || file;
                  for (const t of spec.tests || [])
                    for (const r of t.results || [])
                      if (r.status === "failed" || r.status === "timedOut")
                        out.push(`${require("path").basename(sf)} › ${spec.title || ""}`.trim());
                }
                for (const c of n.suites || []) walk(c, file);
              };
              for (const s of report.suites || []) walk(s, s.file);
              return out;
            };
            const lines = [];
            for (const m of matrix) {
              const rf = `report-shard-${m.shard}.json`;
              let bad = [];
              if (!has(rf)) bad = ["(no report — the shard crashed / timed out before finishing)"];
              else { try { bad = failedTests(JSON.parse(fs.readFileSync(dir + "/" + rf, "utf8"))); } catch { bad = ["(unreadable report)"]; } }
              if (bad.length) lines.push(`- **shard ${m.shard}** — ${bad.length} failure(s):\n` + bad.map((b) => `    - ${b}`).join("\n"));
            }
            // Re-running a SINGLE shard job does NOT re-run this gate (`e2e-collect`) —
            // GitHub only re-triggers `needs:` dependents from the workflow-level
            // "Re-run failed jobs" button. So after a fix or a flake, use THAT button
            // (not the per-shard re-run) or the gate/comment stay stuck on the old result.
            const rerunNote = `\n\n<sub>⚠️ To re-check after a push or flake, use **“Re-run failed jobs”** on the whole workflow — re-running a single shard alone will NOT refresh this gate.</sub>`;
            const body = (lines.length
              ? `### ❌ e2e (Playwright) — failing shards\n\n${lines.join("\n")}\n\n<sub>Sharded run: each shard is a separate runner. See the failed shard job(s) for traces/videos.</sub>`
              : `### ❌ e2e (Playwright) — a shard failed but no per-test failure was recorded (likely an infra/setup error). See the shard job logs.`) + rerunNote;
            fs.writeFileSync("comment.md", body);
          '
          # One sticky comment: edit the existing bot comment if present, else create.
          printf '%s\n\n' "$marker" | cat - comment.md > body.md
          if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$(cat body.md)" >/dev/null
          else
            gh pr comment "${{ github.event.number }}" --body-file body.md >/dev/null
          fi

      # The actual gate: fail this job iff any shard failed. (The distribute job failing
      # also fails this via `needs`.)
      - name: gate on shard results
        if: always()
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ] || [ "${{ needs.e2e-distribute.result }}" != "success" ]; then
            echo "e2e failed: distribute=${{ needs.e2e-distribute.result }} shards=${{ needs.e2e-shard.result }}"
            exit 1
          fi
          echo "all e2e shards passed"

  # ---------------------------------------------------------------------------
  # Flake detection — NIGHTLY. Run the WHOLE Playwright e2e suite with
  # --repeat-each=5: each test executes 5×, and with playwright.config retries=0
  # ANY single failure fails the job and names the flaky test. This surfaces
  # timing/ordering flakes (a dropped turn, a replay race) that a single per-PR
  # run misses. Not on PRs (5× the e2e wall-time); nightly + manual only.
  flake-nightly:
    name: flake detection (e2e ×5, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: e2e ×5 (report flaky)
        env:
          CI: "1"
        # --repeat-each=5 runs every test 5×; the list reporter names each failing
        # repetition. A non-zero exit = at least one repetition flaked.
        run: nix develop --command bash -c 'npm install && npm run test:e2e -- --repeat-each=5 --reporter=list'
      - name: upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flake-nightly-results
          path: test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Focused flake check — PR opt-in. A PR that FIXES a specific flake adds the
  # `flake-check` label AND a structured line in its description naming the test:
  #
  #     flake-test: <playwright -g pattern>
  #
  # e.g.  flake-test: multi-turn re-render
  #
  # OPTIONAL — some flakes only reproduce under CROSS-SPEC CONTENTION (the flaky
  # test interleaved with other specs' load), so a lone `-g <test>` run never
  # triggers them. Such a PR ALSO lists the spec files to run together:
  #
  #     flake-specs: test/e2e/sessions.spec.ts test/e2e/chat-search-filter.spec.ts
  #
  # When `flake-specs:` is present the job runs exactly those spec files (each
  # test 5×) — recreating the contention that surfaces the flake — instead of the
  # whole suite filtered to the pattern. Gated on the label so it never runs on
  # unrelated PRs.
  flake-focus:
    name: flake focus (targeted ×20)
    if: contains(github.event.pull_request.labels.*.name, 'flake-check')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Pull the `flake-test:` pattern (and optional `flake-specs:` list) out of the
      # PR description. Fail loudly if the label is set but no pattern is given (so the
      # check can't silently pass by running nothing).
      - name: resolve flake-test pattern
        id: pat
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/flake-focus-pattern.sh

      # CONTENTION path: `flake-specs:` was given — run those spec FILES together,
      # each test 5×, so cross-spec load (the poll/SSE churn that disrupts an
      # in-progress interaction) recreates the flake. retries=0 → one failure fails.
      - name: e2e ×5 (contention — flake-specs)
        if: steps.pat.outputs.specs != ''
        env:
          CI: "1"
          FLAKE_SPECS: ${{ steps.pat.outputs.specs }}
        run: nix develop --command bash -c 'npm install && npm run test:e2e -- --repeat-each=5 --reporter=list $FLAKE_SPECS'

      # TARGETED path: no `flake-specs:` — hammer just the matching test 20×.
      - name: e2e ×20 (targeted)
        if: steps.pat.outputs.specs == ''
        env:
          CI: "1"
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
        # -g greps test titles; --repeat-each=20 hammers the match. retries=0 means
        # one failure across the 20 fails the job.
        #
        # --trace on OVERRIDES playwright.config's `trace: on-first-retry`: because
        # the config also sets retries=0, on-first-retry NEVER fires — so a normal
        # failure yields only a screenshot + one-line error, never the actionable
        # trace.zip. This job exists specifically to root-cause a known flake, so we
        # force a FULL trace (DOM snapshots + action timeline + console + network)
        # for EVERY repetition regardless of retries. Scoped to this invocation only
        # — the default e2e shards keep retries=0 / on-first-retry untouched. The
        # trace.zip lands under test-results/ (uploaded below); open it with
        # `npx playwright show-trace trace.zip`.
        run: nix develop --command bash -c 'npm install && npm run test:e2e -- -g "$FLAKE_PATTERN" --repeat-each=20 --trace on --reporter=list'
      # if: always() (not failure()) so the trace.zip survives even when the job is
      # cancelled/retried — the whole point of this job is to capture the artifact.
      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-focus-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
