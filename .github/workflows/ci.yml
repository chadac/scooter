name: CI

# Two tiers, chosen by the `tier` job. A PR gets the `pr` tier: the fast checks and
# the core nixosTests. The merge queue, main, the nightly and a PR labelled
# `full-ci` get the `full` tier: everything, adding the image builds, db
# migrations, sharded e2e, the whole nixosTest matrix and the path-gated k3d jobs.
# The opt-in flake, bench and e2e-full jobs stay label-driven on either tier.
# A change to only VERSION and CHANGELOG.md is a release: its PR gets the `skip`
# tier and runs nothing, so it is ready once approved; its queue entry gets the
# `release` tier, the full tier plus e2e-full and the heavy nixosTests, all required.
# Every reporting job saves one gate section (and writes it into a shared PR
# comment), and `ci-summary`, the single required check, evaluates this run's
# sections against the base commit's .github/ci-gates.yml. The Cachix cache
# `scooter` is pushed to when CACHIX_AUTH_TOKEN is set and pulled read-only otherwise.

on:
  pull_request:
    # `labeled` so adding an opt-in label (`full-ci`, `flake-check`,
    # `e2e-full-flake-check`, `e2e-full`, `full-nixos-tests`, `bench`) re-runs CI.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # The merge queue tests each entry on a temporary `gh-readonly-queue/*` ref and
  # needs this trigger for the required checks to run there.
  merge_group:
  # Nightly: the full nixosTest set including HEAVY_TESTS, plus the flake-detection job.
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  # Manual trigger for running the nightly-only jobs on demand.
  workflow_dispatch:

# Cancel superseded runs of the same event on a ref; a push never cancels the nightly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `full` unless this is a PR without the `full-ci` label; see tierFor in ci-report.mjs.
  tier:
    name: choose the check tier
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
      release: ${{ steps.tier.outputs.release }}
      skip: ${{ steps.tier.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci-report.mjs
            .github/ci-gates.yml
          sparse-checkout-cone-mode: false
      - id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node scripts/ci-report.mjs tier --labels "$LABELS"

  ci:
    name: fast checks (flake + typecheck + unit + python)
    needs: tier
    if: needs.tier.outputs.skip != 'true'
    permissions:
      contents: read
      pull-requests: write   # posts its own gate section (scripts/ci-report.mjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v30

      # Cachix binary cache: pushes with CACHIX_AUTH_TOKEN set, pulls read-only without it.
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # check-flake + check-manifests + typecheck + unit vitest inside the pinned dev
      # shell; CI=1 selects vitest's default reporter.
      - name: just ci (flake check, typecheck, unit)
        env:
          CI: "1"
        run: nix develop --command just ci

      # The release FlakeHub push fails if any system's outputs fail to evaluate.
      - name: FlakeHub publish dry run (every system evaluates)
        run: nix develop --command just check-flakehub

      # Each Python service's nix build runs its pytest suite (keep the list in sync
      # with the buildPythonApplication services); `.#contribs-all` aggregates every
      # contrib variant, including `example = true` ones no service build ships.
      - name: python service tests (nix build runs pytest)
        run: nix build .#broker .#webhooks .#checks.x86_64-linux.webhooks-entrypoints .#checks.x86_64-linux.broker-entrypoints .#scheduler .#scooter-task .#scooter-prompt .#checks.x86_64-linux.scooter-prompt-tests .#conversation-controller .#warm-store-controller .#scooter-schema .#contribs-all --print-build-logs

      # Building .#agentHost under nix resolves @scooter/schema through the nix
      # symlink, which the workspace-resolving `just typecheck` cannot exercise.
      - name: agent-host + byoc-controller + generated Drizzle schema + sandbox VS Code pieces (nix)
        run: nix build .#scooter-schema-js .#scooter-svcauth-js .#agentHost .#byoc-controller .#scooter-vscode-ahp .#code-server-bin --print-build-logs

      # This job is the 'fast' gate and reports itself; always() so a red run still
      # resolves the gate for `ci-summary`.
      - name: post fast-checks section
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          OK: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$OK" = "success" ]; then
            status=pass; summary="fast checks — flake · typecheck · unit · python"
            printf 'All fast checks passed.\n' > fast.md
          else
            status=fail; summary="fast checks — FAILED"
            printf 'See the job log: flake eval, typecheck, unit tests or the python builds failed.\n' > fast.md
          fi
          node scripts/ci-report.mjs post --section fast --status "$status" \
            --summary "$summary" --body fast.md --labels "$LABELS"

      - name: upload the fast section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-fast
          path: ${{ runner.temp }}/ci-sections/fast.json
          overwrite: true
          if-no-files-found: ignore

  # Builds every image publish-images.yml ships (without pushing), so an image that
  # stops building fails its PR instead of the next publish on main. Assembling a
  # nix2container image over its whole closure is a failure surface neither the
  # nixosTests nor the path-gated k3d jobs cover; Cachix substitutes unchanged
  # images. x86_64 only: publish also builds aarch64, but arch-only breakage is rare
  # enough not to double every PR's image cost. Keep the matrix in sync with
  # publish-images.yml; `just check-image-coverage` enforces it.
  image-build:
    name: build image ${{ matrix.image.attr }}
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every broken image, not just the first
      matrix:
        image:
          - { attr: agent-host-image, unfree: false }
          - { attr: ui-image, unfree: false }
          - { attr: broker-image, unfree: false }
          - { attr: scheduler-image, unfree: false }
          - { attr: webhooks-image, unfree: false }
          - { attr: db-migrator-image, unfree: false }
          - { attr: agent-host-image-claude, unfree: true }
          - { attr: remote-agent-image, unfree: true }
          - { attr: byoc-controller-image, unfree: false }
          - { attr: conversation-controller-image, unfree: false }
          - { attr: conversation-router-image, unfree: false }
          - { attr: warm-store-controller-image, unfree: false }
          - { attr: sandbox-os-image, unfree: false }
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Building to completion forces every layer derivation. The claude-baked
      # images contain the unfree claude CLI, hence allowUnfree + --impure.
      - name: nix build .#${{ matrix.image.attr }}
        env:
          ATTR: ${{ matrix.image.attr }}
          UNFREE: ${{ matrix.image.unfree }}
        run: |
          set -euo pipefail
          impure=()
          if [ "$UNFREE" = "true" ]; then export NIXPKGS_ALLOW_UNFREE=1; impure=(--impure); fi
          nix build "${impure[@]}" ".#$ATTR" --no-link --print-build-logs

  # Reports the image-build matrix as the `images` gate; always() so a red build
  # still resolves the gate for `ci-summary`.
  image-build-report:
    name: report image builds
    needs: [tier, image-build]
    if: always() && needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: post image-build section
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RESULT: ${{ needs.image-build.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            status=pass; summary="image builds — every published image builds"
            printf 'Every image in publish-images.yml built (x86_64-linux).\n' > images.md
          else
            status=fail; summary="image builds — FAILED ($RESULT)"
            printf 'At least one published image failed to build; see the failing "build image …" job.\n' > images.md
          fi
          node scripts/ci-report.mjs post --section images --status "$status" \
            --summary "$summary" --body images.md --labels "$LABELS"

      - name: upload the images section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-images
          path: ${{ runner.temp }}/ci-sections/images.json
          overwrite: true
          if-no-files-found: ignore

  # Runs the deploy's migrator against a scratch Postgres for both renders (see
  # nix/check-db-migrations.nix), so a migration that cannot apply fails its PR
  # instead of the deploy's migrate Job.
  db-migrations:
    name: db migrations (${{ matrix.variant }})
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [no-contribs, all-contribs]
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: nix build .#checks.x86_64-linux.db-migrate-${{ matrix.variant }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: nix build ".#checks.x86_64-linux.db-migrate-$VARIANT" --no-link --print-build-logs

  # Reports both legs as the `migrations` gate; always() so a red leg still
  # resolves the gate for `ci-summary`.
  db-migrations-report:
    name: report db migrations
    needs: [tier, db-migrations]
    if: always() && needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: post migrations section
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RESULT: ${{ needs.db-migrations.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            status=pass; summary="db migrations — apply cleanly with and without contribs"
            printf 'The migrator applied, re-applied and matched every schema.sql, with no contribs and with every database-owning contrib.\n' > migrations.md
          else
            status=fail; summary="db migrations — FAILED ($RESULT)"
            printf 'A migration failed to apply against a fresh database; see the failing "db migrations (…)" job.\n' > migrations.md
          fi
          node scripts/ci-report.mjs post --section migrations --status "$status" \
            --summary "$summary" --body migrations.md --labels "$LABELS"

      - name: upload the migrations section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-migrations
          path: ${{ runner.temp }}/ci-sections/migrations.json
          overwrite: true
          if-no-files-found: ignore

  # Measures every shipped image, rebuilds the baseline from origin/main in the same
  # job (Cachix substitutes the unchanged images) and posts the diff as a
  # report-only section.
  image-sizes:
    name: image size benchmark
    needs: tier
    runs-on: ubuntu-latest
    if: needs.tier.outputs.full == 'true'
    permissions:
      contents: read
      pull-requests: write   # to post/update the sticky size-report comment
    steps:
      - uses: actions/checkout@v5
        with:
          # main's history for the worktree baseline build.
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # 1. Measure the PR's images (JSON to pr-sizes.json; build logs to stderr).
      #    Strict: a PR image that fails to build fails the job instead of being
      #    skipped as if it were missing.
      - name: measure PR image sizes
        env:
          IMAGE_SIZES_STRICT: "1"
        run: ./scripts/image-sizes.sh > pr-sizes.json

      # 2. Measure origin/main from a worktree with the PR's copy of the script, so
      #    both sides use identical measurement logic.
      - name: measure origin/main (baseline) image sizes
        run: |
          set -euo pipefail
          git worktree add --detach ../main-baseline origin/main
          cp scripts/image-sizes.sh ../main-baseline/image-sizes.sh
          ( cd ../main-baseline && ./image-sizes.sh ) > base-sizes.json
          git worktree remove --force ../main-baseline

      # 3. Render the comparison table and post/update the sticky PR comment.
      - name: post size report section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          ./scripts/image-sizes-diff.sh base-sizes.json pr-sizes.json 5 > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"   # also surface it in the run summary
          # One section of the shared CI comment (scripts/ci-report.mjs), run with the
          # runner's own node since the script has no dependencies.
          # Match the trailer line rather than the ⚠️ glyph, which the legend prints on
          # every run; warn at worst, since this report is a signal rather than a gate.
          if grep -q '^✅ No image grew' report.md; then
            status=pass; summary='image size — no image grew ≥ 5%'
          else
            grew=$(sed -n 's/^⚠️ \*\*\([0-9]*\) image(s) grew.*/\1/p' report.md)
            status=warn; summary="image size — ${grew:-some} image(s) grew ≥ 5%"
          fi
          node scripts/ci-report.mjs post --section size --status "$status" \
            --summary "$summary" --body report.md --labels "$LABELS"

      # A measurement that failed (a PR image did not build) still resolves the
      # section; the `images` gate is what blocks the merge.
      - name: post size failure section
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          printf 'Could not measure image sizes: an image failed to build. See the job log.\n' > report.md
          node scripts/ci-report.mjs post --section size --status fail \
            --summary 'image size — measurement FAILED' --body report.md --labels "$LABELS"

      - name: upload the size section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-size
          path: ${{ runner.temp }}/ci-sections/size.json
          overwrite: true
          if-no-files-found: ignore

  # Touched suites in .github/benchmarks.yml, opt-in via `bench` label.
  bench:
    name: benchmarks (PR vs merge base)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'bench')
    permissions:
      contents: read
      pull-requests: write   # the shared CI comment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # the merge base's worktree
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: run the touched suites, PR and merge base interleaved
        run: scripts/bench-ab.sh "origin/${{ github.base_ref }}" bench-out
      - name: post bench section
        run: |
          set -euo pipefail
          if [ ! -s bench-out/suites.txt ]; then
            printf 'No suite in `.github/benchmarks.yml` covers a path this PR changes.\n' > bench.md
            node scripts/ci-report.mjs post --section bench --status skip \
              --summary 'benchmarks — no suite touched' --body bench.md --labels "$LABELS"
            exit 0
          fi
          # Writes status= and summary= to a local file.
          GITHUB_OUTPUT=verdict.txt node scripts/bench-compare.mjs report bench-out \
            --base-ref "$(git merge-base "origin/${{ github.base_ref }}" HEAD)" > bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci-report.mjs post --section bench \
            --status "$(sed -n 's/^status=//p' verdict.txt)" \
            --summary "$(sed -n 's/^summary=//p' verdict.txt)" --body bench.md --labels "$LABELS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-pyperf
          path: bench-out
          if-no-files-found: ignore
      # Resolve the section even when the harness crashed.
      - name: post bench failure section
        if: failure()
        continue-on-error: true
        run: |
          printf 'The benchmark run failed before it could compare; see the job log.\n' > bench.md
          node scripts/ci-report.mjs post --section bench --status fail \
            --summary 'benchmarks — run FAILED' --body bench.md --labels "$LABELS"

      - name: upload the bench section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-bench
          path: ${{ runner.temp }}/ci-sections/bench.json
          overwrite: true
          if-no-files-found: ignore

  # Enumerates the dev-env-* nixosTests into a matrix so each VM test runs in its
  # own job. HEAVY_TESTS run only nightly or with the `full-nixos-tests` label,
  # which also lifts the `pr` tier's CORE_TESTS-only filter.
  nixos-tests-matrix:
    name: enumerate dev-env nixosTests
    needs: tier
    if: needs.tier.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    env:
      # One VM test each for boot, rebuild, services and tooling.
      CORE_TESTS: "dev-env-systemd-boot dev-env-scooter-rebuild dev-env-service dev-env-stub-tools"
      FULL: ${{ needs.tier.outputs.full }}
      # Tests too expensive for per-PR runs (space-separated check names).
      HEAVY_TESTS: "dev-env-scooter-module"
      # Include heavy tests when: nightly schedule, a release, OR the PR has the label.
      INCLUDE_HEAVY: ${{ github.event_name == 'schedule' || needs.tier.outputs.release == 'true' || contains(github.event.pull_request.labels.*.name, 'full-nixos-tests') }}
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - id: list
        name: list dev-env-* checks
        run: |
          set -euo pipefail
          # All dev-env-* check names.
          all=$(nix eval --json --impure --expr '
            let f = builtins.getFlake (toString ./.);
                s = builtins.currentSystem;
                names = builtins.attrNames f.checks.${s};
            in builtins.filter (n: builtins.match "dev-env-.*" n != null) names')
          if [ "$INCLUDE_HEAVY" = "true" ]; then
            tests="$all"
            echo "including heavy tests ($HEAVY_TESTS)"
          else
            # Drop the heavy ones.
            tests=$(echo "$all" | jq -c --arg heavy "$HEAVY_TESTS" \
              '($heavy | split(" ")) as $h | [ .[] | select( . as $t | ($h | index($t)) | not ) ]')
            echo "excluding heavy tests ($HEAVY_TESTS) — run nightly or add the 'full-nixos-tests' label"
          fi
          if [ "$FULL" != "true" ] && [ "$INCLUDE_HEAVY" != "true" ]; then
            tests=$(echo "$tests" | jq -c --arg core "$CORE_TESTS" \
              '($core | split(" ")) as $c | [ .[] | select( . as $t | ($c | index($t)) ) ]')
            echo "pr tier: core tests only — add the 'full-ci' label for the whole matrix"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "matrix: $tests"

  nixos-test:
    name: nixosTest ${{ matrix.test }}
    needs: nixos-tests-matrix
    runs-on: ubuntu-latest
    # Non-required until the KVM-accelerated matrix is consistently green on the runner.
    continue-on-error: true
    strategy:
      fail-fast: false
      # Cap concurrent VM jobs so the runner pool is not exhausted.
      max-parallel: 4
      matrix:
        test: ${{ fromJSON(needs.nixos-tests-matrix.outputs.tests) }}
    steps:
      - uses: actions/checkout@v5

      # /dev/kvm ships with restrictive group perms on GitHub runners, and without
      # them qemu silently falls back to much slower TCG emulation.
      - name: enable KVM access (else qemu falls back to slow TCG)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: nixbuild/nix-quick-install-action@v30

      # Cachix: pushes when CACHIX_AUTH_TOKEN is set, pulls read-only otherwise.
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # virtiofsd holds one host fd per guest-visible inode, so a test that reads a
      # big tree off the shared store exhausts the default 65536.
      - name: raise the fd limit virtiofsd inherits
        run: |
          # Only matters when nix uses a daemon; the build step raises its own shell's
          # limit for the single-user case.
          if systemctl list-unit-files nix-daemon.service >/dev/null 2>&1; then
            sudo mkdir -p /etc/systemd/system/nix-daemon.service.d
            printf '[Service]\nLimitNOFILE=1048576\n' \
              | sudo tee /etc/systemd/system/nix-daemon.service.d/nofile.conf
            sudo systemctl daemon-reload
            sudo systemctl restart nix-daemon.service || true
          fi

      - name: build ${{ matrix.test }}
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          ulimit -n 1048576
          ulimit -n
          nix build ".#checks.x86_64-linux.${{ matrix.test }}" --print-build-logs

  # Decides from the changed paths which cluster jobs need to run; a release runs all.
  cluster-changes:
    name: detect sandbox-image changes
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ needs.tier.outputs.release == 'true' || steps.filter.outputs.image }}
      platform: ${{ needs.tier.outputs.release == 'true' || steps.filter.outputs.platform }}
      example: ${{ needs.tier.outputs.release == 'true' || steps.filter.outputs.example }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge group's base commit, which the filter diffs against.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # v3 has no merge_group case; empty on a PR, where it uses the PR's base.
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            image:
              - 'pkgs/sandbox-os/**'
              - 'modules/sandbox-os/**'
              - 'pkgs/broker-tools/**'
              - 'flake.nix'
              - 'test/cluster/sandbox-os.spec.ts'
              - 'test/cluster/overlay-store.spec.ts'
              - 'test/cluster/scooter-converge.spec.ts'
              - 'test/cluster/nix-build-sandbox.spec.ts'
              - 'test/cluster/userns-migration.spec.ts'
              # The warm-seed unit lives in the sandbox image and the warm-store spec
              # needs only that image.
              - 'test/cluster/warm-store.spec.ts'
              - 'modules/warm-store-controller.nix'
              - 'services/warm-store-controller/**'
              # The .scooter seed lives in the provisioner, so a seed change must run
              # the converge spec.
              - 'services/agent-host/src/session/k8sProvisioner.ts'
              - 'test/support/cluster.ts'
            # `example` and `platform` are separate outputs so the platform smoke and
            # the sandbox-image specs can run independently.
            example:
              - 'examples/**'
              - 'modules/**'
              - 'flake.nix'
            platform:
              - 'modules/platform.nix'
              - 'modules/conversation-controller.nix'
              # Sandbox NetworkPolicy: only a real CNI shows whether it blocks too much.
              - 'modules/network-policy.nix'
              - 'services/conversation-controller/**'
              - 'services/conversation-router/**'
              - 'test/cluster/platform-smoke.spec.ts'
              - 'flake.nix'
              # The agent-host side of the multi-replica contract: it writes the
              # conversations rows the controller assigns, and hydrate() adopts them on boot.
              - 'services/agent-host/src/session/conversationRegistry.ts'
              - 'services/agent-host/src/session/pgConversationRegistry.ts'
              # Everything that decides what the e2e-full browser stories run must
              # open the gate too.
              - '.github/workflows/ci.yml'
              # ...and the scripts the job delegates to for cluster bring-up,
              # port-forward setup and the failure dump.
              - '.github/scripts/**'
              - 'playwright.config.ts'
              - 'test/e2e/target.ts'
              # The event-backfill Job and its cluster spec run only in this job.
              - 'modules/event-backfill.nix'
              - 'test/cluster/event-backfill.spec.ts'
              # The full-target allowlist and every spec on it must open the gate,
              # since this is the only job that executes them; keep the list in sync
              # with test/e2e/full-specs.json.
              - 'test/e2e/full-specs.json'
              - 'test/e2e/cluster-stories.spec.ts'
              - 'test/e2e/first-message.spec.ts'
              - 'test/e2e/chat-search-filter.spec.ts'
              - 'test/e2e/linked-resources.spec.ts'
              - 'test/e2e/target.ts'
              - 'test/e2e/support/shard-e2e.mjs'
              - 'test/e2e/support/shard-tests.mjs'
              - 'test/e2e/support/test-inventory.mjs'
              - 'test/e2e/test-weights.json'
              - 'test/e2e/client-server-identity.spec.ts'
              - 'test/e2e/long-conversation.spec.ts'
              - 'test/e2e/multi-turn-integrity.spec.ts'
              - 'test/e2e/refresh-history.spec.ts'
              - 'test/e2e/revive.spec.ts'
              - 'test/e2e/stop-run.spec.ts'
              - 'test/e2e/tail-rerender.spec.ts'
              - 'test/e2e/aws-interrupt.spec.ts'
              - 'test/e2e/interrupt-queue-recovery.spec.ts'
              - 'test/e2e/interrupt.spec.ts'
              - 'test/e2e/live-real-agent.spec.ts'
              - 'test/e2e/tier.ts'
              - 'test/e2e/multi-user.spec.ts'
              - 'test/e2e/contrib-api-relay.spec.ts'
              - 'test/e2e/ownership.spec.ts'
              - 'test/e2e/concurrency-divergence.spec.ts'
              - 'test/e2e/conversation.spec.ts'
              - 'test/e2e/live-monitoring.spec.ts'
              - 'test/e2e/queue-durability.spec.ts'
              - 'test/e2e/scroll-lock.spec.ts'
              - 'test/e2e/sessions.spec.ts'
              - 'test/e2e/settings-tabs.spec.ts'
              - 'test/e2e/suspended-recovery.spec.ts'
              - 'test/e2e/warm-store.spec.ts'
              - 'test/e2e/support/rolloutHook.py'
              - 'test/e2e/fixtures.ts'
              - 'test/e2e/full-specs.json'
              - 'test/e2e/client-server-identity.spec.ts'
              - 'test/e2e/cluster-stories.spec.ts'
              - 'test/e2e/first-message.spec.ts'
              - 'test/e2e/component-coverage.spec.ts'
              - 'test/e2e/refresh-history.spec.ts'
              - 'test/e2e/stop-run.spec.ts'
              - 'test/e2e/ui-state-consistency.spec.ts'
              - 'services/agent-host/src/session/ownershipGuard.ts'
              - 'services/agent-host/src/session/manager.ts'
              # Conversations are created by the router (a CR write) and the agent-host
              # refuses an unknown threadId, and platform-smoke is the only place that
              # exercises create-then-prompt on a real cluster.
              - 'services/agent-host/src/agui/server.ts'
              - 'services/agent-host/src/api/management.ts'
              - 'services/scheduler/scheduler/spawn.py'
              - 'services/webhooks/webhooks/agent_host_client.py'

  # Image-boot specs on a real k3d cluster: the OCI packaging, the in-pod
  # systemd-PID-1 boot and the local-overlay store in its production topology,
  # which the nixosTest VMs cannot cover. Path-gated via cluster-changes; only the
  # self-contained image-boot specs run.
  cluster-image-boot:
    name: cluster image boot (k3d)
    needs: cluster-changes
    if: needs.cluster-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Required: this is the only tier that boots the real OCI image in a pod.
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # k3d needs Docker (present on ubuntu-latest); k3d and kubectl come from nixpkgs.
      - name: create k3d cluster
        run: |
          nix shell nixpkgs#k3d nixpkgs#kubectl -c k3d cluster create scooter-ci --no-lb --wait
          nix shell nixpkgs#k3d -c k3d kubeconfig merge scooter-ci --kubeconfig-merge-default

      # `<attr>.copyTo docker-daemon:<name>:<tag>` loads the nix2container image
      # straight into Docker, and k3d then imports it by name.
      - name: build + import sandbox image
        run: |
          set -euo pipefail
          # The overlay-store spec uses this same image (OVERLAY_IMAGE == SANDBOX_OS_IMAGE).
          nix run ".#sandbox-os-image.copyTo" -- docker-daemon:agent-sandbox-os:latest
          nix shell nixpkgs#k3d -c k3d image import agent-sandbox-os:latest -c scooter-ci

      # Only the self-contained image-boot specs, inside the dev shell so node/npm
      # come from the flake.
      - name: image-boot specs
        env:
          RUN_CLUSTER_TESTS: "1"
          CLUSTER_PROVIDER: existing
          SANDBOX_OS_IMAGE: agent-sandbox-os:latest
          OVERLAY_IMAGE: agent-sandbox-os:latest   # same image (overlay always on)
          CI: "1"
        # --no-file-parallelism: each spec boots a privileged systemd-PID-1 pod, and
        # two at once on single-node k3d contend for resources and share the namespace.
        run: nix develop --command bash -c 'npm install && npm run test:cluster -- sandbox-os overlay-store scooter-converge scooterRebuildTwice warm-store --no-file-parallelism'

      - name: tear down k3d
        if: always()
        run: |
          nix shell nixpkgs#k3d -c k3d cluster delete scooter-ci || true
          nix shell nixpkgs#k3d -c k3d registry delete scooter-reg.localhost || true

  # The image in a user-namespaced pod (`sandboxUserNamespace`): systemd boots with namespaced
  # SYS_ADMIN, the overlay store mounts through idmapped volumes, and Nix builds run in Nix's own
  # build sandbox. Pinned to the production k3s line, since user namespaces need Kubernetes >= 1.33.
  cluster-userns:
    name: cluster user-namespace sandbox (k3d)
    needs: cluster-changes
    if: needs.cluster-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The rancher/k3s image ships only runc, which gives non-privileged systemd no writable cgroup,
      # and a user-namespaced pod cannot fall back to `privileged`. So hand the node a crun (plus the
      # store it links against). k3s detects it on PATH and registers the `crun` RuntimeClass.
      - name: create k3d cluster (k3s 1.35, with crun)
        run: |
          set -euo pipefail
          crun=$(readlink -f "$(nix build --no-link --print-out-paths nixpkgs#crun)/bin/crun")
          nix shell nixpkgs#k3d nixpkgs#kubectl -c k3d cluster create scooter-userns --no-lb --wait \
            --image rancher/k3s:v1.35.4-k3s1 \
            -v /nix/store:/nix/store:ro@server:0 \
            -v "$crun:/usr/local/bin/crun:ro@server:0"
          nix shell nixpkgs#k3d -c k3d kubeconfig merge scooter-userns --kubeconfig-merge-default
          for _ in $(seq 60); do
            nix shell nixpkgs#kubectl -c kubectl get runtimeclass crun >/dev/null 2>&1 && break
            sleep 2
          done
          nix shell nixpkgs#kubectl -c kubectl get runtimeclass crun

      - name: build + import sandbox image
        run: |
          set -euo pipefail
          nix run ".#sandbox-os-image.copyTo" -- docker-daemon:agent-sandbox-os:latest
          nix shell nixpkgs#k3d -c k3d image import agent-sandbox-os:latest -c scooter-userns

      - name: user-namespace spec (crun)
        env:
          RUN_CLUSTER_TESTS: "1"
          CLUSTER_PROVIDER: existing
          SANDBOX_OS_IMAGE: agent-sandbox-os:latest
          SANDBOX_RUNTIME_CLASS: crun
          CI: "1"
          KEEP_TEST_PODS: "1"
        run: nix develop --command bash -c 'npm install && npm run test:cluster -- nix-build-sandbox userns-migration'

      - name: dump pod state on failure
        if: failure()
        run: |
          k() { nix shell nixpkgs#kubectl -c kubectl -n agent-sandbox-test "$@" || true; }
          k get pods -o wide
          for pod in $(k get pods -o name); do
            k describe "$pod"
            k logs "$pod" --tail=200
            k logs "$pod" --previous --tail=200
          done
          k get events --sort-by=.lastTimestamp
          nix shell nixpkgs#kubectl -c kubectl get runtimeclass || true

      - name: tear down k3d
        if: always()
        run: nix shell nixpkgs#k3d -c k3d cluster delete scooter-userns || true

  # Validates the example's rendered YAML against a real k3d apiserver with a
  # server-side dry-run, which runs the real schema and admission validation that
  # `just check-manifests` cannot. No images are built or pulled; runtime is covered
  # by the platform smoke.
  example-manifests:
    name: example manifests (k3d dry-run)
    needs: cluster-changes
    if: needs.cluster-changes.outputs.example == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: render the example
        run: nix build .#example-manifests -o example.yaml

      - name: create k3d cluster
        run: |
          nix shell nixpkgs#k3d -c k3d cluster create scooter-example \
            --agents 0 --wait --timeout 180s

      # A dry-run validates against current cluster state, so the namespace and the
      # CRDs the manifests' own resources depend on must be applied for real first.
      - name: install the rendered namespace + CRDs
        run: |
          set -euo pipefail
          nix shell nixpkgs#yq-go nixpkgs#kubectl -c bash -c '
            yq eval-all "select(.kind == \"Namespace\" or .kind == \"CustomResourceDefinition\")" \
              example.yaml > prereqs.yaml
            if [ -s prereqs.yaml ]; then kubectl apply --server-side -f prereqs.yaml; fi
            kubectl get ns
          '

      - name: validate against the apiserver (server-side dry-run)
        run: |
          set -euo pipefail
          # --server-side runs the apiserver's real schema and admission validation;
          # a fresh k3d has no competing field managers.
          nix shell nixpkgs#kubectl -c kubectl apply --server-side -f example.yaml \
            --dry-run=server 2>&1 | tee dry-run.log
          count=$(grep -c 'serverside-applied' dry-run.log || true)
          echo "== validated ${count} resources =="
          # A render that produced nothing would otherwise "pass" silently.
          if [ "${count}" -lt 20 ]; then
            echo "::error::only ${count} resources validated — the example render looks empty/broken"
            exit 1
          fi

      - name: dump on failure
        if: failure()
        run: |
          nix shell nixpkgs#kubectl -c kubectl get crds -o name || true
          tail -50 dry-run.log || true

      - name: delete cluster
        if: always()
        run: nix shell nixpkgs#k3d -c k3d cluster delete scooter-example || true

  # Reports the path-gated k3d jobs as the `cluster` gate; skipped jobs were not
  # asked to run, so all-skipped reports skip.
  cluster-report:
    name: report cluster jobs
    needs: [tier, cluster-changes, cluster-image-boot, cluster-userns, example-manifests]
    if: always() && needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: post cluster section
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RESULTS: >-
            changes=${{ needs.cluster-changes.result }}
            image-boot=${{ needs.cluster-image-boot.result }}
            userns=${{ needs.cluster-userns.result }}
            example-manifests=${{ needs.example-manifests.result }}
        run: |
          set -euo pipefail
          read -ra results <<< "$RESULTS"
          printf -- '- %s\n' "${results[@]}" > cluster.md
          if printf '%s\n' "${results[@]}" | grep -qvE '=(success|skipped)$'; then
            status=fail; summary="cluster jobs — FAILED"
          elif printf '%s\n' "${results[@]}" | grep -v '^changes=' | grep -q '=success$'; then
            status=pass; summary="cluster jobs — pass"
          else
            status=skip; summary="cluster jobs — no cluster-relevant paths changed"
          fi
          node scripts/ci-report.mjs post --section cluster --status "$status" \
            --summary "$summary" --body cluster.md --labels "$LABELS"

      - name: upload the cluster section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-cluster
          path: ${{ runner.temp }}/ci-sections/cluster.json
          overwrite: true
          if-no-files-found: ignore

  # e2e full is sharded with the same distribute -> shard-matrix -> collect shape
  # as e2e fast; each shard boots its own cluster.
  e2e-full-distribute:
    name: e2e full distribute (shard)
    # Trigger-gated only (nightly, manual, a release, or the `e2e-full` label); the
    # platform path filter would skip product-code changes the suite must cover.
    needs: tier
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.tier.outputs.release == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-full')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      # Only the repeat count: the planner caps the shard count at the inventory size,
      # so `matrix.include | length` is the trustworthy figure downstream.
      repeat: ${{ steps.budget.outputs.repeat }}
    steps:
      - uses: actions/checkout@v5

      # Every spec on a shard competes for sandbox provisioning (CI forces
      # CONVERSATION_POD_CAP=1), so the shard count is a provisioning-concurrency
      # control as much as a wall-clock one.
      - id: budget
        name: resolve the sweep budget
        env:
          # A labelled PR stays a single pass: it wants a verdict, and five costs the
          # fleet ~90 min. A sweep of a branch is a `workflow_dispatch` away.
          SWEEP: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          ONE_SHARD: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-one-shard') }}
        run: |
          set -euo pipefail
          # Twice the shards keeps a sweep's wall clock near a single pass's.
          if [ "$SWEEP" = "true" ]; then repeat=5; shards=8; else repeat=1; shards=4; fi
          # `e2e-one-shard` is infrastructure work on the bring-up, where the suite is
          # beside the point.
          if [ "$ONE_SHARD" = "true" ]; then repeat=1; shards=1; fi
          echo "repeat=$repeat" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "each test ×$repeat across $shards shard(s)"

      # nix + npm install are needed because the planner's inventory comes from
      # `playwright test --list` and `vitest list`, which resolve projects, testMatch
      # and testIgnore.
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # A window of recent runs regardless of conclusion, not the last GREEN one: the full
      # suite goes green rarely enough that `--status success` selects nothing and the plan
      # silently falls back to the committed table. Weighting from a red run is safe because
      # shard-tests takes a per-test MAX and floors it with that table.
      - name: fetch recent e2e-full reports (for weights)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p prior
          # Walk back from newest: the artifact expires (90d) and a run that died before
          # `merge reports` has none, so "most recent" is not "has one".
          runs=$(gh run list --workflow "${{ github.workflow }}" --branch "$DEFAULT_BRANCH" \
            --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
          found=0
          for id in $runs; do
            [ "$found" -ge 5 ] && break
            [ "$id" = "${{ github.run_id }}" ] && continue
            if gh run download "$id" --name e2e-full-report --dir "prior/$id" 2>/dev/null; then
              found=$((found + 1))
              echo "weights: took e2e-full-report from run $id"
            fi
          done
          [ "$found" -gt 0 ] || echo "no recent e2e-full report — using committed weights"

      - id: plan
        name: plan shards
        env:
          E2E_FULL_SHARDS: ${{ steps.budget.outputs.shards }}
          # The planner weights the e2e tests by the repetitions they will get, so a
          # shard carrying cluster tests (which run once either way) is not overpacked.
          E2E_FULL_REPEAT: ${{ steps.budget.outputs.repeat }}
        run: |
          set -euo pipefail
          # Per-test sharding: shard-tests.mjs exits non-zero unless the union of every
          # shard's selection equals the inventory exactly once.
          # The JSON goes to a file because `nix develop` prints a banner to stdout
          # that $(...) would capture.
          # Listing the cluster project imports agent-host sources, and those resolve
          # @scooter/schema through its built dist/, which a fresh checkout does not have.
          nix develop --command bash -c \
            "npm install --silent && npm -w @scooter/schema run build --silent && npm -w @scooter/svcauth run build --silent && PRIOR_REPORT_DIR=prior SHARDS='$E2E_FULL_SHARDS' REPEAT='$E2E_FULL_REPEAT' node test/e2e/support/shard-tests.mjs > /tmp/matrix.json"
          matrix=$(cat /tmp/matrix.json)
          # Fail now on a banner or stray log line rather than downstream.
          echo "$matrix" | jq -e 'has("include")' >/dev/null \
            || { echo "::error::planner did not emit a matrix"; head -c 400 /tmp/matrix.json; exit 1; }

          # `e2e-one-shard` is for infrastructure work where the thing under test is
          # the cluster bring-up, so narrow to one cheap test; the selector is a
          # --grep, so the title must exist or the shard silently runs nothing.
          if [ "$E2E_FULL_SHARDS" = "1" ]; then
            matrix=$(node -e '
              const m = JSON.parse(process.argv[1]);
              m.include = [{ ...m.include[0],
                e2e_grep: "sending a message streams an assistant reply",
                cluster_grep: "",
                e2e_count: 1, cluster_count: 0 }];
              process.stdout.write(JSON.stringify(m));
            ' "$matrix")
            echo "one-shard mode: narrowed to a single e2e test"
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One e2e-full shard: brings up k3d plus the full multi-replica platform (fake
  # agent), runs its assigned cluster tests and browser stories, and uploads its
  # report.
  e2e-full-shard:
    name: e2e full shard ${{ matrix.shard }}
    needs: e2e-full-distribute
    # Runs only when distribute did — that job carries the opt-in decision.
    if: needs.e2e-full-distribute.result == 'success'
    # The self-hosted fleet, for this job only: a shard is ~25 min of k3d and
    # platform deploy, ~60 on a sweep. Safe only because the gate above is
    # schedule/dispatch/label, or a queued release that changes no code, none of
    # which a fork can trigger; `runs-on` is not a security boundary on its own.
    runs-on: [self-hosted, linux, x64, nix]
    # Bounds a wedged cluster holding a fleet runner all day; the default 360 does not.
    timeout-minutes: 150
    strategy:
      fail-fast: false # one shard failing must not cancel the others (collect reports all)
      matrix: ${{ fromJSON(needs.e2e-full-distribute.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      # No authToken: self-hosted runners get no secrets, and a shard only needs to pull.
      - uses: cachix/cachix-action@v15
        with:
          name: scooter

      # One script so the `flake focus full` job stands up an identical cluster.
      - name: bring up k3d + the platform
        run: .github/scripts/k3d-platform-up.sh

      # Only the cluster tests this shard was assigned; the `if` guards the empty
      # case because vitest -t with an empty pattern matches everything.
      - name: cluster smoke (shard ${{ matrix.shard }})
        id: cluster-smoke
        if: matrix.cluster_grep != ''
        # A red smoke must not skip the browser stories; the `gate on the cluster
        # smoke` step below is what fails the shard instead. Why: PR #751.
        continue-on-error: true
        env:
          RUN_CLUSTER_TESTS: "1"
          CLUSTER_PROVIDER: existing
          CI: "1"
          # The pattern travels as an env var, never interpolated into the shell,
          # because shard selectors contain apostrophes.
          CLUSTER_GREP: ${{ matrix.cluster_grep }}
          CLUSTER_JSON: "cluster-report-shard-${{ matrix.shard }}.json"
        # platform-smoke: the multi-replica topology comes up and a conversation
        # routes; event-backfill: the mirror→Postgres Job end-to-end against this
        # platform's Postgres and history PVC (see modules/event-backfill.nix).
        run: |
          # The file filters are required: `-t` selects by name but vitest still loads
          # every file in the project, and they must stay in step with
          # SHARDED_CLUSTER_SPECS in test/e2e/support/test-inventory.mjs.
          nix develop --command bash -c 'npm install && npx vitest run --project cluster --no-file-parallelism platform-smoke event-backfill -t "$CLUSTER_GREP" --reporter=default --reporter=json --outputFile="$CLUSTER_JSON"'

      # The browser stories against the real cluster, the one seam neither
      # test/cluster (curl-only) nor the fast suite (no real server) covers.
      # serves both the app and /conversations — exactly the browser's real topology).
      - name: e2e full browser stories ×${{ needs.e2e-full-distribute.outputs.repeat }} (shard ${{ matrix.shard }})
        # An empty --grep matches everything, so a shard with no e2e tests must skip.
        if: matrix.e2e_grep != ''
        env:
          E2E_TARGET: full
          E2E_CLUSTER_URL: http://127.0.0.1:8899
          E2E_ROLLOUT_HOOK: http://127.0.0.1:8898
          CI: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "report-full-shard-${{ matrix.shard }}.json"
          # An env var, not an inlined string, since test titles contain apostrophes.
          E2E_GREP: ${{ matrix.e2e_grep }}
          # `retries: 0` is pinned in playwright.config.ts, so each repetition counts
          # as an independent run and the rates below mean something.
          E2E_FULL_REPEAT: ${{ needs.e2e-full-distribute.outputs.repeat }}
        run: |
          set -euo pipefail
          # Sourced so the background PIDs and cleanup trap live in this shell and
          # are reaped with the step.
          . .github/scripts/e2e-full-serve.sh
          # --grep with the alternation of escaped titles built by shard-tests.mjs;
          # the `if` above guards the empty pattern.
          nix develop --command bash -c 'npm install && npx playwright test --project=full --repeat-each="$E2E_FULL_REPEAT" --reporter=json,list --grep "$E2E_GREP"'

      - name: upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-report-shard-${{ matrix.shard }}
          path: |
            report-full-shard-${{ matrix.shard }}.json
            cluster-report-shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: upload cluster browser artifacts
        if: failure() || steps.cluster-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            /tmp/pf.log
            /tmp/pf-sandbox.log
            /tmp/sandbox-edge.log
            /tmp/cluster-sampler.log
            /tmp/rollout-hook.log
            /tmp/platform-logs/
          retention-days: 7
      # always(): a sandbox can crash, be retried by the kubelet, and the spec still
      # pass, so the census runs on green too; it exits 0 and only annotates.
      - name: sandbox crash census
        if: always()
        run: .github/scripts/k3d-sandbox-census.sh
      - name: dump platform state on failure
        if: failure() || steps.cluster-smoke.outcome == 'failure'
        run: .github/scripts/k3d-dump-state.sh

      - name: tear down k3d
        if: always()
        run: nix shell nixpkgs#k3d -c k3d cluster delete scooter-ci || true

      # Sizes the persistent /nix volumes on the runner fleet (volume = 3x the
      # nightly's `du` figure, rotate at 2.5x), with always() so a failed shard still
      # reports; root is reported too because DiskPressure on root, not /nix, is
      # what evicts the platform.
      - name: report /nix/store size
        if: always()
        run: |
          df -h /nix / 2>/dev/null || df -h / || true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then du -sh /nix/store 2>/dev/null || true; fi
          # Whether /nix is the pooled EBS volume or the instance root disk decides
          # whether a store was reused or built cold.
          findmnt -no SOURCE,FSTYPE,SIZE /nix 2>/dev/null || echo "/nix is not a separate mount (root disk)"

      # Last, so the deferred failure lands after every report, artifact and
      # teardown step above has run. Why: PR #751.
      - name: gate on the cluster smoke
        if: always() && steps.cluster-smoke.outcome == 'failure'
        run: |
          echo "::error::cluster smoke failed on shard ${{ matrix.shard }} — see the verdict comment for which tests"
          exit 1

  # The gate for e2e full: succeeds only when every shard passed, merges the
  # per-shard reports into `e2e-full-report` for the next run's weights, and skips
  # (not passes) when the suite was opted out.
  e2e-full-collect:
    name: e2e full (k3d)
    needs: [e2e-full-distribute, e2e-full-shard]
    # Skips rather than passes when the suite was opted out.
    if: always() && needs.e2e-full-distribute.result == 'success'
    runs-on: ubuntu-latest
    # The verdict comment (below) edits a PR comment; the default token is read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # First: actions/checkout cleans the workspace and would delete reports
      # downloaded before it.
      - uses: actions/checkout@v5

      - name: gate on shard results
        env:
          SHARDS_RESULT: ${{ needs.e2e-full-shard.result }}
          DISTRIBUTE_RESULT: ${{ needs.e2e-full-distribute.result }}
        run: |
          set -euo pipefail
          echo "distribute=$DISTRIBUTE_RESULT shards=$SHARDS_RESULT"
          [ "$DISTRIBUTE_RESULT" = "success" ] && [ "$SHARDS_RESULT" = "success" ]

      - name: download shard reports
        # always(): the gate step above fails the job on a red night, and the
        # report must still be merged and uploaded.
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-full-report-shard-*
          path: shard-reports
          merge-multiple: true
        continue-on-error: true

      - name: merge reports → e2e-full-report
        if: always()
        continue-on-error: true
        env:
          MATRIX: ${{ needs.e2e-full-distribute.outputs.matrix }}
        run: |
          set -euo pipefail
          node scripts/merge-e2e-full-reports.mjs --dir shard-reports --matrix "$MATRIX" --out report.json

      # Kept for the next run's shard weights and as the per-night record of which
      # specs passed; distribute weights from the last successful run only.
      - name: upload merged e2e-full-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-report
          path: report.json
          # A baseline window needs enough runs to show the spread.
          retention-days: 90
          if-no-files-found: ignore

      # The baseline is the last run that produced a report, not the last successful
      # one: the workflow conclusion covers every job, so an unrelated red job would
      # void the comparison.
      - name: fetch baseline e2e-full report (last run on the default branch)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          # Walk back from newest: the artifact expires and a run that died before
          # the merge has none.
          runs=$(gh run list --workflow "${{ github.workflow }}" --branch "$DEFAULT_BRANCH" \
            --limit 20 --json databaseId,headSha,createdAt \
            --jq '.[] | "\(.databaseId) \(.headSha) \(.createdAt)"' 2>/dev/null || true)
          # A window, not one run: the suite's own night-to-night churn would read as
          # regressions against a single baseline (see scripts/e2e-full-compare.mjs).
          found=0 newest=""
          while read -r id sha created; do
            [ -n "${id:-}" ] || continue
            [ "$found" -ge 5 ] && break
            # Skip ourselves: on the nightly, this run IS the newest run on main.
            if [ "$id" = "${{ github.run_id }}" ]; then continue; fi
            if gh run download "$id" --name e2e-full-report --dir "baseline/$id" 2>/dev/null; then
              found=$((found + 1))
              [ -z "$newest" ] && newest="${DEFAULT_BRANCH}@${sha:0:7} (${created%T*})"
              # The column header for this run in the verdict's history table.
              printf '%s' "${created%T*}" | cut -c6- > "baseline/$id/label"
              echo "baseline run $id (${sha:0:7}, $created)"
            fi
          done <<< "$runs"
          if [ "$found" -gt 0 ]; then
            echo "BASELINE_REF=$newest" >> "$GITHUB_ENV"
            echo "baseline window: $found run(s)"
          else
            echo "no run on $DEFAULT_BRANCH carries an e2e-full-report — no baseline this time"
          fi

      # The verdict is the diff against main, since the full suite's night-to-night
      # failure count carries no signal on its own.
      - name: compare against the baseline
        if: always()
        continue-on-error: true
        id: compare
        env:
          MATRIX: ${{ needs.e2e-full-distribute.outputs.matrix }}
        run: |
          set -euo pipefail
          # `sort` on the run-id directory names is chronological (ids increase),
          # so the history columns read oldest → newest, left to right.
          base=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            base+=(--baseline "$f")
            label="$(cat "$(dirname "$f")/label" 2>/dev/null || true)"
            base+=(--baseline-label "${label:-?}")
          done < <(find baseline -name report.json 2>/dev/null | sort)
          if [ ${#base[@]} -gt 0 ]; then base+=(--baseline-ref "${BASELINE_REF:-unknown}"); fi
          # A lost shard's specs are absent from the merge, which set difference reads
          # as "passed"; the compare script voids the diff when the shard count is short.
          shards=$(echo "$MATRIX" | jq '.include | length')
          node scripts/e2e-full-compare.mjs report.json "${base[@]}" \
            --expected-shards "$shards" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # Sweeps are nightly-only, so there is no PR to comment on: step summary and
      # artifact instead.
      - name: per-test flake rates (sweep only)
        if: always() && needs.e2e-full-distribute.outputs.repeat != '1'
        continue-on-error: true
        env:
          MATRIX: ${{ needs.e2e-full-distribute.outputs.matrix }}
          REPEAT: ${{ needs.e2e-full-distribute.outputs.repeat }}
        run: |
          set -euo pipefail
          # The verdict's baseline window again, this time as the trend columns.
          hist=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            hist+=(--history "$f")
            label="$(cat "$(dirname "$f")/label" 2>/dev/null || true)"
            hist+=(--history-label "${label:-?}")
          done < <(find baseline -name report.json 2>/dev/null | sort)
          shards=$(echo "$MATRIX" | jq '.include | length')
          node scripts/e2e-full-flake-report.mjs report.json \
            --repeat "$REPEAT" --expected-shards "$shards" "${hist[@]}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > sweep.md
          cat sweep.md >> "$GITHUB_STEP_SUMMARY"

      # The record a later night's trend columns read from.
      - name: upload the sweep report
        if: always() && hashFiles('sweep.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-flake-report
          path: sweep.md
          retention-days: 90
          if-no-files-found: ignore

      # Sticky on a PR, so a re-run replaces the verdict; in the queue, the section only.
      - name: post the verdict on the PR
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && hashFiles('comment.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # No --summary: the compare script renders its own <details> summary line,
          # so ci-report places the body verbatim.
          # Advisory per .github/ci-gates.yml except on a release, which needs `pass`.
          status=warn
          grep -q '^<details><summary>✅' comment.md && status=pass
          grep -q '^<details><summary>❌' comment.md && status=fail
          node scripts/ci-report.mjs post --section e2e-full --status "$status" \
            --body comment.md --labels "$LABELS"

      - name: upload the e2e-full section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-e2e-full
          path: ${{ runner.temp }}/ci-sections/e2e-full.json
          overwrite: true
          if-no-files-found: ignore

  # e2e fast: Playwright through the UI against the fake-agent stack, sharded as
  # distribute → e2e-shard → e2e-collect. Each shard has its own runner, webServer
  # and /tmp state, so playwright.config's workers:1 holds within a shard while
  # shards run in parallel.

  # Balances the spec files into N shards weighted by per-file runtime from the
  # last successful run's report, with test/e2e/shard-weights.json as the fallback.
  e2e-distribute:
    name: e2e fast distribute (shard)
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_SHARDS: "4"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      # Best-effort: without a prior report the committed fallback weights are used.
      - name: fetch prior e2e report (for weights)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p prior
          run_id=$(gh run list --workflow "${{ github.workflow }}" --branch "${{ github.event.repository.default_branch }}" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "${run_id:-}" ]; then
            gh run download "$run_id" --name e2e-report --dir prior 2>/dev/null \
              && echo "downloaded prior e2e report from run $run_id" \
              || echo "no e2e-report artifact on run $run_id — using committed weights"
          else
            echo "no prior successful run — using committed weights"
          fi

      - id: plan
        name: plan shards
        run: |
          set -euo pipefail
          report=""
          [ -f prior/report.json ] && report="prior/report.json"
          matrix=$(PRIOR_REPORT="$report" SHARDS="$E2E_SHARDS" node test/e2e/support/shard-e2e.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each shard runs its assigned spec files on its own runner and webServer and
  # emits a per-shard Playwright JSON report.
  e2e-shard:
    name: e2e fast shard ${{ matrix.shard }}
    needs: e2e-distribute
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one shard failing must not cancel the others (collect reports all)
      matrix: ${{ fromJSON(needs.e2e-distribute.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # PLAYWRIGHT_JSON_OUTPUT_NAME makes the json reporter write to a file;
      # pretest:e2e builds the agent-host dist.
      - name: e2e fast (shard ${{ matrix.shard }})
        env:
          CI: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "report-shard-${{ matrix.shard }}.json"
        run: nix develop --command bash -c 'npm install && npm run test:e2e -- --reporter=json,list ${{ matrix.specs }}'

      # Uploaded on success or failure so collect can merge a weights artifact from
      # a fully-green run.
      - name: upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: report-shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      # Traces/videos/screenshots for a failing shard.
      - name: upload shard artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The gate: succeeds only when every shard passed, reports failing shards on the
  # PR, and merges the per-shard reports into `e2e-report` (from a fully-green run
  # only, so weights stay clean).
  e2e-collect:
    name: e2e fast (Playwright, fake stack)
    needs: [tier, e2e-distribute, e2e-shard]
    if: always() && needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to post/update the sticky per-shard failure comment
    steps:
      - uses: actions/checkout@v5

      # A missing shard report just contributes no weights next time.
      - name: download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-report-shard-*
          path: shard-reports
          merge-multiple: true
        continue-on-error: true

      - name: merge reports → e2e-report
        continue-on-error: true
        run: |
          set -euo pipefail
          # A merged suites array is enough: the distribute parser reads only
          # `.suites[].file` and per-test durations.
          node -e '
            const fs = require("fs");
            const dir = "shard-reports";
            let suites = [];
            for (const f of (fs.existsSync(dir) ? fs.readdirSync(dir) : [])) {
              if (!f.endsWith(".json")) continue;
              try { const r = JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")); suites = suites.concat(r.suites || []); } catch {}
            }
            fs.writeFileSync("report.json", JSON.stringify({ suites }));
            console.log("merged " + suites.length + " top-level suites into report.json");
          '

      - name: upload merged e2e-report (for next run's shard weights)
        if: needs.e2e-shard.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: report.json
          retention-days: 14
          if-no-files-found: ignore

      # One sticky section reflecting the current e2e result; it runs on green too
      # so a prior failure resolves.
      - name: post e2e shard section
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MATRIX: ${{ needs.e2e-distribute.outputs.matrix }}
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
          DISTRIBUTE_RESULT: ${{ needs.e2e-distribute.result }}
        run: |
          set -euo pipefail
          # A cancelled distribute publishes no matrix, so there are no shards to
          # attribute a result to.
          if [ -z "${MATRIX:-}" ]; then
            echo "distribute=$DISTRIBUTE_RESULT published no matrix — nothing to report"
            exit 0
          fi
          # GitHub exposes only the aggregate result on `needs`, so per-shard pass/fail
          # is reconstructed from the uploaded reports; a missing report is a crashed
          # shard, not an absence of tests.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const matrix = JSON.parse(process.env.MATRIX).include;
            const dir = "shard-reports";
            const failedTests = (report) => {
              const out = [];
              const walk = (n, file) => {
                if (!n || typeof n !== "object") return;
                file = n.file || file;
                for (const spec of n.specs || []) {
                  const sf = spec.file || file;
                  for (const t of spec.tests || [])
                    for (const r of t.results || [])
                      if (r.status === "failed" || r.status === "timedOut")
                        out.push(`${path.basename(sf)} › ${spec.title || ""}`.trim());
                }
                for (const c of n.suites || []) walk(c, file);
              };
              for (const s of report.suites || []) walk(s, s.file);
              return out;
            };
            const lines = [];
            let failures = 0;
            for (const m of matrix) {
              const rf = `report-shard-${m.shard}.json`;
              let bad = [];
              if (!fs.existsSync(dir + "/" + rf))
                bad = ["(no report — the shard crashed / timed out before finishing)"];
              else {
                try { bad = failedTests(JSON.parse(fs.readFileSync(dir + "/" + rf, "utf8"))); }
                catch { bad = ["(unreadable report)"]; }
              }
              failures += bad.length;
              if (bad.length)
                lines.push(`- **shard ${m.shard}** — ${bad.length} failure(s):\n` + bad.map((b) => `    - ${b}`).join("\n"));
            }
            // Re-running a single shard job does not re-run this gate; only the
            // workflow-level "Re-run failed jobs" re-triggers `needs:` dependents.
            const note = "\n\n<sub>⚠️ To re-check after a push or flake, use **“Re-run failed jobs”** on the whole workflow — re-running a single shard alone will NOT refresh this gate.</sub>";
            const green = process.env.SHARDS_RESULT === "success" && process.env.DISTRIBUTE_RESULT === "success";
            fs.writeFileSync("shard-count", String(failures));
            fs.writeFileSync(
              "comment.md",
              green
                ? "Every shard is green on the latest run."
                : (lines.length
                    ? lines.join("\n") + note
                    : "A shard failed but no per-test failure was recorded (likely an infra/setup error). See the shard job logs." + note),
            );
          '
          shards=$(echo "$MATRIX" | jq '.include | length')
          if [ "$SHARDS_RESULT" = "success" ] && [ "$DISTRIBUTE_RESULT" = "success" ]; then
            status=pass; summary="e2e fast — $shards/$shards shards pass"
          else
            status=fail; summary="e2e fast — $(cat shard-count) failing test(s)"
          fi
          node scripts/ci-report.mjs post --section e2e-fast --status "$status" \
            --summary "$summary" --body comment.md --labels "$LABELS"

      - name: upload the e2e-fast section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-e2e-fast
          path: ${{ runner.temp }}/ci-sections/e2e-fast.json
          overwrite: true
          if-no-files-found: ignore

      # The gate: fail iff any shard failed.
      - name: gate on shard results
        if: always()
        run: |
          # A cancelled run was superseded and its replacement carries the real checks
          # for this SHA, so cancellation passes the gate.
          if [ "${{ needs.e2e-distribute.result }}" = "cancelled" ] || [ "${{ needs.e2e-shard.result }}" = "cancelled" ]; then
            echo "e2e cancelled (run superseded) — deferring to the replacement run"
            exit 0
          fi
          if [ "${{ needs.e2e-shard.result }}" != "success" ] || [ "${{ needs.e2e-distribute.result }}" != "success" ]; then
            echo "e2e failed: distribute=${{ needs.e2e-distribute.result }} shards=${{ needs.e2e-shard.result }}"
            exit 1
          fi
          echo "all e2e shards passed"

  # ---------------------------------------------------------------------------
  # Flake detection, nightly: the whole e2e suite with --repeat-each=5 under
  # retries=0, so any single failure names the flaky test.
  flake-nightly:
    name: flake detection (e2e ×5, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: e2e ×5 (report flaky)
        env:
          CI: "1"
        run: nix develop --command bash -c 'npm install && npm run test:e2e -- --repeat-each=5 --reporter=list'
      - name: upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flake-nightly-results
          path: test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Focused flake check, PR opt-in via the `flake-check` label. The PR description
  # names the test with `flake-test: <playwright -g pattern>` and may add
  # `flake-specs: <spec files>` for flakes that only reproduce under cross-spec
  # contention, in which case those files run together instead of the whole suite
  # filtered to the pattern.
  flake-focus:
    name: flake focus (targeted ×20)
    if: contains(github.event.pull_request.labels.*.name, 'flake-check')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to post/update the sticky flake-verdict comment
    env:
      # One absolute path so the writer (inside `nix develop`) and the reader name
      # the same file regardless of working directory.
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/flake-report.json
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the control run builds a worktree at the PR's base commit.
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Fails loudly when the label is set but no pattern is given.
      - name: resolve flake-test pattern
        id: pat
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/flake-focus-pattern.sh

      # Contention path: run the `flake-specs:` files together, each test N×, so
      # cross-spec load recreates the flake. N is the budget the script resolved —
      # the mode's default unless the PR body raised it with `flake-repeat:`.
      - name: e2e ×N (contention — flake-specs)
        if: steps.pat.outputs.mode == 'contention'
        env:
          CI: "1"
          FLAKE_SPECS: ${{ steps.pat.outputs.specs_run }}
          FLAKE_REPEAT: ${{ steps.pat.outputs.repeat }}
        # `json` alongside `list`: the exit status cannot say whether the targeted
        # test passed, failed or ever ran, so the report below answers that.
        run: nix develop --command bash -c 'npm install && npm run test:e2e -- --repeat-each="$FLAKE_REPEAT" --reporter=list,json $FLAKE_SPECS'

      # Targeted path: hammer just the matching test N×.
      - name: e2e ×N (targeted)
        if: steps.pat.outputs.mode == 'targeted'
        env:
          CI: "1"
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
          FLAKE_REPEAT: ${{ steps.pat.outputs.repeat }}
        # --trace on overrides playwright.config's `trace: on-first-retry`, which
        # never fires under retries=0, so every repetition gets a full trace.zip
        # under test-results/.
        run: nix develop --command bash -c 'npm install && npm run test:e2e -- -g "$FLAKE_PATTERN" --repeat-each="$FLAKE_REPEAT" --trace on --reporter=list,json'

      # Resolves `flake-test:` against the report, since a green job under
      # `flake-specs:` can pass having never executed the flaky test; plain `node`
      # so this still posts when the run step died before `nix develop` finished.
      - name: resolve the verdict (no comment yet)
        id: summary
        if: always()
        env:
          # Via env, never inline `${{ }}`: these come from the PR description, so
          # interpolating them into `run:` would let a PR body execute shell.
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
          FLAKE_SPECS: ${{ steps.pat.outputs.specs_run }}
          FLAKE_MODE: ${{ steps.pat.outputs.mode }}
        run: |
          set -euo pipefail
          node scripts/flake-focus-report.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME" \
            --pattern "$FLAKE_PATTERN" --target fast --mode "$FLAKE_MODE" > /dev/null

      # The control runs the same test with the same budget on the PR's base commit
      # (only when the PR's own run came back clean) because "0 failures in 20 runs"
      # is unfalsifiable alone; continue-on-error and `|| true` because a red
      # baseline is the expected outcome.
      - name: control — does it still reproduce on the base?
        id: control
        # !cancelled(), not always(): a superseded run must not spend ten minutes on
        # a control nobody will read.
        if: "!cancelled() && steps.summary.outputs.verdict == 'fixed'"
        continue-on-error: true
        env:
          CI: "1"
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
          FLAKE_SPECS: ${{ steps.pat.outputs.specs_run }}
          FLAKE_REPEAT: ${{ steps.pat.outputs.repeat }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/flake-baseline.json
          # A different Postgres port: `pg_ctl` daemonizes, so the first run's database
          # can outlive playwright's webServer teardown and still hold 55432.
          E2E_PG_PORT: "55433"
        run: |
          set -euo pipefail
          # Reap any database the run above left behind.
          pkill -f 'scooter-e2e-pg' 2>/dev/null || true
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          git worktree add --detach ../baseline "$BASE_SHA"
          cd ../baseline
          # Same commands and repetition counts, or the two rates are incomparable —
          # including a budget the PR raised, which is the whole point of raising it.
          if [ -n "$FLAKE_SPECS" ]; then
            nix develop --command bash -c 'npm install && npm run test:e2e -- --repeat-each="$FLAKE_REPEAT" --reporter=list,json $FLAKE_SPECS' || true
          else
            nix develop --command bash -c 'npm install && npm run test:e2e -- -g "$FLAKE_PATTERN" --repeat-each="$FLAKE_REPEAT" --reporter=list,json' || true
          fi

      - name: flake verdict comment
        # !cancelled(): a cancelled run has no report, and its comment would
        # overwrite a good verdict in the shared comment.
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
          FLAKE_SPECS: ${{ steps.pat.outputs.specs_run }}
          FLAKE_MODE: ${{ steps.pat.outputs.mode }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-full-flake-check') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Only nag about the full target when this PR isn't already running it.
          suggest=(--suggest-full); [ "$HAS_FULL_LABEL" = "true" ] && suggest=()
          # Absent when the control was skipped; the comment then has no control section.
          base=()
          [ -f flake-baseline.json ] && base=(--baseline flake-baseline.json --baseline-ref "$BASE_REF@${BASE_SHA:0:7}")
          node scripts/flake-focus-report.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME" \
            --pattern "$FLAKE_PATTERN" --target fast --mode "$FLAKE_MODE" \
            --specs "$FLAKE_SPECS" --run-url "$RUN_URL" \
            "${suggest[@]}" "${base[@]}" > flake-comment.md
          cat flake-comment.md >> "$GITHUB_STEP_SUMMARY"
          # One section of the shared CI comment; advisory per .github/ci-gates.yml,
          # but the gate blocks while it is pending.
          status=pass
          grep -q "STILL reproduces" flake-comment.md && status=fail
          grep -q "no power" flake-comment.md && status=warn
          node scripts/ci-report.mjs post --section flake-fast --status "$status" \
            --summary "$(sed -n 's/^### [^ ]* //p' flake-comment.md | head -1 | grep . || echo 'flake focus (fast)')" \
            --body flake-comment.md --labels "$LABELS"

      - name: upload the flake-fast section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-flake-fast
          path: ${{ runner.temp }}/ci-sections/flake-fast.json
          overwrite: true
          if-no-files-found: ignore

      # A run that executed the targeted test zero times exits 0 and is the false
      # green this job exists to prevent.
      - name: gate — the targeted test must have run
        if: always() && steps.summary.outputs.verdict == 'not-run'
        run: |
          echo "::error::The PR's 'flake-test:' pattern matched no test that ran —" \
               "this check proved nothing about the flake. See the PR comment."
          exit 1

      # always() so the trace.zip survives a cancelled or retried job.
      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-focus-results
          path: |
            test-results/
            flake-report.json
            flake-baseline.json
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Focused flake check against the full target, PR opt-in via the
  # `e2e-full-flake-check` label. Same contract as `flake-focus` (`flake-test:` /
  # `flake-specs:` in the PR body), but the repetitions run on a real k3d cluster,
  # because the fast stack has no sandbox pods and so cannot reproduce the cold
  # boots, CPU saturation or provisioning contention the full-target flakes live
  # in. Runs on the self-hosted fleet, where those flakes are observed, with lower
  # repeat counts since each repetition costs a real sandbox pod.
  flake-focus-full:
    name: flake focus full (k3d, targeted ×5)
    # Label only, not gated on `cluster-changes`: a flake fix is usually test-only
    # and the path filter would skip it.
    if: contains(github.event.pull_request.labels.*.name, 'e2e-full-flake-check')
    runs-on: [self-hosted, linux, x64, nix]
    permissions:
      contents: read
      pull-requests: write   # to post/update the sticky flake-verdict comment
    env:
      # The JSON report the verdict is computed from.
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/flake-report.json
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the control step builds a worktree at the PR's base commit.
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # FULL_TARGET=1 intersects `flake-specs:` with the full-target allowlist and
      # fails if nothing is left to run.
      - name: resolve flake-test pattern
        id: pat
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          FULL_TARGET: "1"
        run: .github/scripts/flake-focus-pattern.sh

      - name: bring up k3d + the platform
        run: .github/scripts/k3d-platform-up.sh

      # Contention path: run the full-allowlisted `flake-specs:` files together so
      # competing for sandbox provisioning recreates the flake.
      - name: e2e full ×N (contention — flake-specs)
        if: steps.pat.outputs.mode == 'contention'
        env:
          E2E_TARGET: full
          E2E_CLUSTER_URL: http://127.0.0.1:8899
          E2E_ROLLOUT_HOOK: http://127.0.0.1:8898
          CI: "1"
          FLAKE_SPECS: ${{ steps.pat.outputs.specs_run }}
          # The budget the pattern script resolved: this target's default unless the
          # PR body raised it with `flake-full-repeat:`.
          FLAKE_REPEAT: ${{ steps.pat.outputs.repeat }}
        run: |
          set -euo pipefail
          . .github/scripts/e2e-full-serve.sh
          nix develop --command bash -c 'npm install && just e2e-full-run --repeat-each="$FLAKE_REPEAT" --reporter=list,json $FLAKE_SPECS'

      # Targeted path: --trace on overrides `trace: on-first-retry`, which never
      # fires under retries=0.
      - name: e2e full ×N (targeted)
        if: steps.pat.outputs.mode == 'targeted'
        env:
          E2E_TARGET: full
          E2E_CLUSTER_URL: http://127.0.0.1:8899
          E2E_ROLLOUT_HOOK: http://127.0.0.1:8898
          CI: "1"
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
          FLAKE_REPEAT: ${{ steps.pat.outputs.repeat }}
        run: |
          set -euo pipefail
          . .github/scripts/e2e-full-serve.sh
          nix develop --command bash -c 'npm install && just e2e-full-run -g "$FLAKE_PATTERN" --repeat-each="$FLAKE_REPEAT" --trace on --reporter=list,json'

      # Before the control, which replaces this cluster with the base's; always(),
      # since a sandbox can crash, be retried by the kubelet, and the spec still pass.
      - name: sandbox crash census
        if: always()
        run: .github/scripts/k3d-sandbox-census.sh
      - name: dump platform state on failure
        if: failure()
        run: .github/scripts/k3d-dump-state.sh

      # The control below runs only on a clean verdict, so resolve it first; the
      # comment is posted after the control.
      - name: resolve the verdict (no comment yet)
        id: summary
        if: always()
        env:
          # Via env, never inline `${{ }}`: these come from the PR description,
          # so interpolating them into `run:` would let a PR body execute shell.
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
          FLAKE_SPECS: ${{ steps.pat.outputs.specs_run }}
          FLAKE_MODE: ${{ steps.pat.outputs.mode }}
        run: |
          set -euo pipefail
          nix develop --command node scripts/flake-focus-report.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME" \
            --pattern "$FLAKE_PATTERN" --target full --mode "$FLAKE_MODE" > /dev/null

      # The control runs the same test with the same budget on the base's own
      # platform (only when the PR's run came back clean) because "0 failures in 5
      # runs" is unfalsifiable alone; continue-on-error and `|| true` because a red
      # baseline is the expected outcome.
      - name: control — does it still reproduce on the base?
        id: control
        # !cancelled(), not always(): a superseded run must not spend ten minutes on
        # a control nobody will read.
        if: "!cancelled() && steps.summary.outputs.verdict == 'fixed'"
        continue-on-error: true
        env:
          E2E_TARGET: full
          E2E_CLUSTER_URL: http://127.0.0.1:8899
          E2E_ROLLOUT_HOOK: http://127.0.0.1:8898
          CI: "1"
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
          FLAKE_SPECS: ${{ steps.pat.outputs.specs_run }}
          # Same budget as the run above, raised or not: two different budgets make
          # the two rates incomparable.
          FLAKE_REPEAT: ${{ steps.pat.outputs.repeat }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Absolute and under the PR's workspace so it outlives the baseline worktree.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/flake-baseline.json
          # No E2E_PG_PORT override: the `full` project sets `webServer: undefined`,
          # so no local Postgres is started.
        run: |
          set -euo pipefail
          # One cluster at a time; the registry survives this and its content-addressed
          # tags skip every image push the base shares with the PR.
          nix shell nixpkgs#k3d -c k3d cluster delete scooter-ci || true
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          git worktree add --detach ../baseline "$BASE_SHA"
          cd ../baseline
          # The base's own bring-up script and manifests, not the PR's.
          .github/scripts/k3d-platform-up.sh
          . .github/scripts/e2e-full-serve.sh
          # Same project and repetition counts as the run above; open-coded
          # `npx playwright` because `just` here resolves the base's justfile.
          if [ -n "$FLAKE_SPECS" ]; then
            nix develop --command bash -c 'npm install && npx playwright test --project=full --repeat-each="$FLAKE_REPEAT" --reporter=list,json $FLAKE_SPECS' || true
          else
            nix develop --command bash -c 'npm install && npx playwright test --project=full -g "$FLAKE_PATTERN" --repeat-each="$FLAKE_REPEAT" --reporter=list,json' || true
          fi

      # Prior evidence: the nightly `e2e-full-report` artifacts say whether this spec
      # is failing on main now, which catches a control that reproduced nothing while
      # main still fails the spec; it does not replace the control, since a nightly's
      # rate includes full-suite contention.
      - name: fetch the nightly e2e-full window (main)
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # gh is in neither the devshell nor the fleet runner image.
        run: nix shell nixpkgs#gh -c .github/scripts/fetch-e2e-full-window.sh history 5

      # Same contract as the fast job's comment, but this is the evidence that
      # counts for a flake first seen on `e2e-full`.
      - name: flake verdict comment
        # !cancelled(): a cancelled run has no report, and its comment would
        # overwrite a good verdict in the shared comment.
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # Env, not inline `${{ }}`: these come from the PR description.
          FLAKE_PATTERN: ${{ steps.pat.outputs.pattern }}
          FLAKE_SPECS: ${{ steps.pat.outputs.specs_run }}
          FLAKE_MODE: ${{ steps.pat.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Absent when the control was skipped; the comment then has no control section.
          base=()
          [ -f flake-baseline.json ] && base=(--baseline flake-baseline.json --baseline-ref "$BASE_REF@${BASE_SHA:0:7}")
          # `sort` on the run-id directory names is chronological (ids increase),
          # so the window reads oldest → newest, matching its label row.
          hist=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            hist+=(--history "$f")
            hist+=(--history-label "$(cat "$(dirname "$f")/label" 2>/dev/null || true)")
          done < <(find history -name report.json 2>/dev/null | sort)
          # The redirect sits inside the devshell: the shellHook's banner goes to
          # the outer stdout and would otherwise land at the top of the comment.
          # The history window is always the default branch's nightly, whatever
          # this PR is based on.
          nix develop --command bash -c 'node scripts/flake-focus-report.mjs "$@" > flake-comment.md' _ \
            "$PLAYWRIGHT_JSON_OUTPUT_NAME" \
            --pattern "$FLAKE_PATTERN" --target full --mode "$FLAKE_MODE" \
            --specs "$FLAKE_SPECS" --run-url "$RUN_URL" --history-ref "$DEFAULT_BRANCH" \
            "${base[@]}" "${hist[@]}"
          cat flake-comment.md >> "$GITHUB_STEP_SUMMARY"
          # One section of the shared CI comment; advisory per .github/ci-gates.yml,
          # but the gate blocks while it is pending.
          status=pass
          grep -q "STILL reproduces" flake-comment.md && status=fail
          grep -q "no power" flake-comment.md && status=warn
          nix develop --command node scripts/ci-report.mjs post --section flake-full --status "$status" \
            --summary "$(sed -n 's/^### [^ ]* //p' flake-comment.md | head -1 | grep . || echo 'flake focus (full)')" \
            --body flake-comment.md --labels "$LABELS"

      - name: upload the flake-full section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-flake-full
          path: ${{ runner.temp }}/ci-sections/flake-full.json
          overwrite: true
          if-no-files-found: ignore

      # Zero repetitions of the targeted test is a false green.
      - name: gate — the targeted test must have run
        if: always() && steps.summary.outputs.verdict == 'not-run'
        run: |
          echo "::error::The PR's 'flake-test:' pattern matched no test that ran on the" \
               "full target — this check proved nothing about the flake. See the PR comment."
          exit 1

      # always(): a cancelled run is the one that most needs the trace and sampler.
      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-focus-full-results
          path: |
            test-results/
            flake-report.json
            flake-baseline.json
            /tmp/pf.log
            /tmp/pf-sandbox.log
            /tmp/sandbox-edge.log
            /tmp/cluster-sampler.log
            /tmp/rollout-hook.log
            /tmp/platform-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: tear down k3d
        if: always()
        run: nix shell nixpkgs#k3d -c k3d cluster delete scooter-ci || true

  # One section for the whole nixosTest matrix, written by this single job, since
  # concurrent legs would spend the retry budget on each other.
  nixos-report:
    name: nixosTest report
    needs: [nixos-tests-matrix, nixos-test]
    # Skipped matrix: a skip-tier run, which reports nothing.
    if: always() && needs.nixos-tests-matrix.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: post nixosTest section
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          TESTS: ${{ needs.nixos-tests-matrix.outputs.tests }}
          RESULT: ${{ needs.nixos-test.result }}
        run: |
          set -euo pipefail
          n=$(echo "$TESTS" | jq 'length')
          if [ "$RESULT" = "success" ]; then
            status=pass; summary="nixosTests — $n/$n pass"
          elif [ "$RESULT" = "skipped" ]; then
            status=skip; summary="nixosTests — skipped"
          else
            status=fail; summary="nixosTests — at least one VM test failed"
          fi
          # `needs` exposes only the aggregate result, so name the legs and point at the run.
          echo "$TESTS" | jq -r '.[] | "- \(.)"' > nixos.md
          printf '\n<sub>Per-leg results are the `nixosTest *` checks on this commit.</sub>\n' >> nixos.md
          node scripts/ci-report.mjs post --section nixos --status "$status" \
            --summary "$summary" --body nixos.md --labels "$LABELS"

      - name: upload the nixos section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-section-nixos
          path: ${{ runner.temp }}/ci-sections/nixos.json
          overwrite: true
          if-no-files-found: ignore

  # The required check, in the merge queue as on a PR: fails unless every gate in
  # play passed in this run, since an unreported gate is not a passing gate. The
  # gates and their evaluator come from the base commit, so a PR cannot loosen the
  # rules it is judged by. needs every producer so it runs last; always() so a red
  # producer still yields a verdict.
  ci-summary:
    name: ci summary (gates)
    needs: [tier, ci, image-build-report, db-migrations-report, image-sizes, bench, nixos-report, cluster-report, e2e-collect, e2e-full-collect, flake-focus, flake-focus-full]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          sparse-checkout: |
            scripts/ci-report.mjs
            .github/ci-gates.yml
          sparse-checkout-cone-mode: false
      # This run's sections only; a missing one leaves its gate pending.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-section-*
          path: ${{ runner.temp }}/ci-sections
          merge-multiple: true
      - name: evaluate the gates
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node scripts/ci-report.mjs evaluate --labels "$LABELS"
