name: Publish images (ghcr.io)

# Build every shipped container image with Nix and push it to GitHub Container
# Registry under a CONTENT tag — the Nix store hash of the built image (12 chars).
# Same content → same tag, so an unchanged image is NOT rebuilt or re-pushed (the
# tag already exists in ghcr → skip). Matches the content-tag scheme used by the
# local deploy / itops-infra / aeonai-agent.
#
# Images land at: ghcr.io/<owner>/scooter/<image>:<content-tag>
#   e.g. ghcr.io/chadac/scooter/ui:bpmbd4xc316k
# plus a floating `latest` that always points at main's current content.
#
# Auth: the built-in GITHUB_TOKEN with packages:write — no PAT needed. Nix builds
# are Cachix-backed (same cache as CI), so a changed image still builds fast.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # One publish per ref; a newer push supersedes an in-flight one.
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to ghcr.io/<owner>/scooter/*

jobs:
  publish:
    name: publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    # The ubuntu-latest runner ships an /etc/containers/registries.conf in the OLD v1
    # format, which the nixpkgs skopeo (and n2c's bundled skopeo, used by `.copyTo`)
    # rejects: "registries.conf must be in v2 format but is in v1" — failing at
    # `skopeo login` before anything else. Point every skopeo at an empty conf we own
    # so it ignores the runner's file. Job-level so it covers login + inspect + copy +
    # the `nix run .copyTo` push. The file is created in the first step below.
    env:
      CONTAINERS_REGISTRIES_CONF: ${{ github.workspace }}/.registries.conf
    strategy:
      fail-fast: false # one image failing must not block the others
      matrix:
        include:
          # Every image is nix2container: pushed with `<attr>.copyTo`. Image NAMES
          # follow the canonical agent-* convention deploy.sh + the kubenix module
          # already use.
          - { image: agent-host, attr: agent-host-image }
          - { image: agent-sandbox-ui, attr: ui-image }
          - { image: agent-broker, attr: broker-image }
          - { image: agent-scheduler, attr: scheduler-image }
          - { image: agent-webhooks, attr: webhooks-image }
          # claude variant bakes the unfree claude-code CLI → allowUnfree + --impure.
          - { image: agent-host-claude, attr: agent-host-image-claude, unfree: true }
          # sandbox-os is nix2container too now (initializeNixDatabase bakes the
          # read-only store's Nix DB + .links) — no docker-archive tarball case.
          # One image — the writable overlay store is always on.
          - { image: agent-sandbox-os, attr: sandbox-os-image }
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Empty registries.conf (v2-parseable, no content) at CONTAINERS_REGISTRIES_CONF,
      # so skopeo ignores the runner's incompatible v1 /etc/containers/registries.conf.
      - name: neutralize the runner's v1 registries.conf
        run: 'touch "$CONTAINERS_REGISTRIES_CONF"'

      # skopeo: logs in to ghcr (its ~/.docker/config.json auth is reused by
      # nix2container's copyTo) and does the `latest` retag.
      - name: install skopeo
        run: nix profile install nixpkgs#skopeo

      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u '${{ github.actor }}' --password-stdin

      # CONTENT tag = the image's Nix store hash (12 chars), evaluated WITHOUT building.
      # If ghcr already has that tag, the image is unchanged → skip build + push.
      - name: compute content tag + check registry
        id: tag
        env:
          NIXPKGS_ALLOW_UNFREE: ${{ matrix.unfree && '1' || '' }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/scooter/${{ matrix.image }}"
          impure=""; [ -n "${NIXPKGS_ALLOW_UNFREE:-}" ] && impure="--impure"
          out=$(nix eval $impure --raw ".#${{ matrix.attr }}.outPath")
          tag=$(basename "$out" | cut -d- -f1 | cut -c1-12)
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"   >> "$GITHUB_OUTPUT"
          if skopeo inspect "docker://${repo}:${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "== ${repo}:${tag} already published — skipping build/push =="
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "== ${repo}:${tag} not in registry — will build + push =="
          fi

      # Build + push the nix2container image via its .copyTo (content tag).
      - name: build + push (nix2container)
        if: steps.tag.outputs.exists == 'false'
        env:
          NIXPKGS_ALLOW_UNFREE: ${{ matrix.unfree && '1' || '' }}
        run: |
          set -euo pipefail
          impure=""; [ -n "${NIXPKGS_ALLOW_UNFREE:-}" ] && impure="--impure"
          nix run $impure ".#${{ matrix.attr }}.copyTo" -- "docker://${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.tag }}"

      # Move `latest` to this build's content tag. Cheap registry-side copy (no
      # rebuild) — runs even when the content tag already existed, so `latest`
      # always tracks main's current content.
      - name: retag latest
        run: |
          set -euo pipefail
          skopeo --insecure-policy copy \
            "docker://${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.tag }}" \
            "docker://${{ steps.tag.outputs.repo }}:latest"
