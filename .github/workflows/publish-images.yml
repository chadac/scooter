name: Publish images (ghcr.io)

# Build every shipped container image with Nix and push it to GitHub Container
# Registry under a content tag (the first 12 chars of the image's Nix store hash),
# so an unchanged image is neither rebuilt nor re-pushed. Images land at
# ghcr.io/<owner>/scooter/<image>:<content-tag>, plus a floating `latest` that
# points at main's current content. Auth is the built-in GITHUB_TOKEN with
# packages:write.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # release.yml: also tag each image with the release version.
  workflow_call:
    inputs:
      version:
        type: string
        required: true

concurrency:
  # One publish per ref; a newer push supersedes an in-flight one.
  group: publish-images-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to ghcr.io/<owner>/scooter/*

jobs:
  publish:
    name: publish ${{ matrix.image.name }} (${{ matrix.arch.nix }})
    # Native runners per arch; emulated builds of full Nix closures are too slow.
    runs-on: ${{ matrix.arch.runner }}
    # The runner's /etc/containers/registries.conf is in the v1 format skopeo
    # rejects, so every skopeo (login, inspect, copyTo) is pointed at an empty conf
    # created in the first step.
    env:
      CONTAINERS_REGISTRIES_CONF: ${{ github.workspace }}/.registries.conf
    strategy:
      fail-fast: false # one image failing must not block the others
      matrix:
        # Every image is built for both arches under an arch-suffixed tag, and the
        # `manifest` job joins each pair into one multi-arch tag.
        arch:
          - { nix: x86_64-linux, runner: ubuntu-latest, docker: amd64 }
          - { nix: aarch64-linux, runner: ubuntu-24.04-arm, docker: arm64 }
        # `image` must be a real axis: an `include:` entry whose keys match no existing
        # combination is appended as its own job instead of multiplied across `arch`.
        image:
          # Every image is nix2container, pushed with `<attr>.copyTo`; names follow
          # the agent-* convention deploy.sh and the kubenix module use.
          - { name: agent-host, attr: agent-host-image, unfree: false }
          - { name: agent-sandbox-ui, attr: ui-image, unfree: false }
          - { name: agent-broker, attr: broker-image, unfree: false }
          - { name: agent-scheduler, attr: scheduler-image, unfree: false }
          - { name: agent-webhooks, attr: webhooks-image, unfree: false }
          - { name: agent-db-migrator, attr: db-migrator-image, unfree: false }
          # claude variant bakes the unfree claude-code CLI → allowUnfree + --impure.
          - { name: agent-host-claude, attr: agent-host-image-claude, unfree: true }
          # The BYO-Claude container users `docker run` from the Settings one-liner,
          # the only image end users pull directly; unfree bakes the claude CLI.
          - { name: remote-agent, attr: remote-agent-image, unfree: true }
          # The controllers, each referenced by a module default (${registryPrefix}<name>).
          - { name: byoc-controller, attr: byoc-controller-image, unfree: false }
          - { name: conversation-controller, attr: conversation-controller-image, unfree: false }
          - { name: conversation-router, attr: conversation-router-image, unfree: false }
          - { name: warm-store-controller, attr: warm-store-controller-image, unfree: false }
          - { name: agent-sandbox-os, attr: sandbox-os-image, unfree: false }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}

      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # An empty, v2-parseable registries.conf so skopeo ignores the runner's v1 file.
      - name: neutralize the runner's v1 registries.conf
        run: 'touch "$CONTAINERS_REGISTRIES_CONF"'

      # skopeo logs in to ghcr (nix2container's copyTo reuses its ~/.docker/config.json)
      # and does the `latest` retag.
      - name: install skopeo
        run: nix profile install nixpkgs#skopeo

      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u '${{ github.actor }}' --password-stdin

      # The content tag is evaluated without building; if ghcr already has it the
      # build and push are skipped.
      - name: compute content tag + check registry
        id: tag
        env:
          NIXPKGS_ALLOW_UNFREE: ${{ matrix.image.unfree && '1' || '' }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/scooter/${{ matrix.image.name }}"
          impure=""; [ -n "${NIXPKGS_ALLOW_UNFREE:-}" ] && impure="--impure"
          # The shared tag is the x86_64 content hash, the string ghcrImages embeds in
          # the kubenix defaults, so it must not vary by arch; each arch pushes to
          # <tag>-<arch> and the `manifest` job joins those.
          out=$(nix eval $impure --raw ".#packages.x86_64-linux.${{ matrix.image.attr }}.outPath")
          tag=$(basename "$out" | cut -d- -f1 | cut -c1-12)
          archtag="${tag}-${{ matrix.arch.docker }}"
          echo "repo=${repo}"       >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"
          echo "archtag=${archtag}" >> "$GITHUB_OUTPUT"
          if skopeo inspect "docker://${repo}:${archtag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "== ${repo}:${archtag} already published — skipping build/push =="
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "== ${repo}:${archtag} not in registry — will build + push =="
          fi

      # Build + push the nix2container image via its .copyTo (content tag).
      - name: build + push (nix2container)
        if: steps.tag.outputs.exists == 'false'
        env:
          NIXPKGS_ALLOW_UNFREE: ${{ matrix.image.unfree && '1' || '' }}
        run: |
          set -euo pipefail
          impure=""; [ -n "${NIXPKGS_ALLOW_UNFREE:-}" ] && impure="--impure"
          # `.#<attr>` on this runner builds its arch natively.
          nix run $impure ".#${{ matrix.image.attr }}.copyTo" -- "docker://${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.archtag }}"


  # Joins each image's per-arch tags into one multi-arch tag, so `docker pull <tag>`
  # serves the right arch, then moves `latest` to it.
  manifest:
    name: multi-arch manifest ${{ matrix.image }}
    needs: publish
    # Runs even when a publish leg failed, so one broken (image, arch) pair does not
    # block every manifest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CONTAINERS_REGISTRIES_CONF: ${{ github.workspace }}/.registries.conf
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: agent-host, attr: agent-host-image }
          - { image: agent-sandbox-ui, attr: ui-image }
          - { image: agent-broker, attr: broker-image }
          - { image: agent-scheduler, attr: scheduler-image }
          - { image: agent-webhooks, attr: webhooks-image }
          - { image: agent-db-migrator, attr: db-migrator-image }
          - { image: agent-host-claude, attr: agent-host-image-claude, unfree: true }
          - { image: agent-sandbox-os, attr: sandbox-os-image }
          - { image: remote-agent, attr: remote-agent-image, unfree: true }
          - { image: byoc-controller, attr: byoc-controller-image }
          - { image: conversation-controller, attr: conversation-controller-image }
          - { image: conversation-router, attr: conversation-router-image }
          - { image: warm-store-controller, attr: warm-store-controller-image }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: neutralize the runner's v1 registries.conf
        run: 'touch "$CONTAINERS_REGISTRIES_CONF"'

      - name: install tooling
        run: nix profile install nixpkgs#skopeo nixpkgs#manifest-tool

      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: create the multi-arch manifest + move latest
        env:
          NIXPKGS_ALLOW_UNFREE: ${{ matrix.unfree && '1' || '' }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/scooter/${{ matrix.image }}"
          impure=""; [ -n "${NIXPKGS_ALLOW_UNFREE:-}" ] && impure="--impure"
          # Same x86_64-pinned content tag the publish job used — the string ghcrImages embeds.
          out=$(nix eval $impure --raw ".#packages.x86_64-linux.${{ matrix.attr }}.outPath")
          tag=$(basename "$out" | cut -d- -f1 | cut -c1-12)

          # ARCH, not ARCHVARIANT, which expands arm64 to "arm64v8"; --ignore-missing so
          # a single-arch push still publishes something usable.
          manifest-tool --username '${{ github.actor }}' --password '${{ secrets.GITHUB_TOKEN }}' \
            push from-args --ignore-missing \
            --platforms linux/amd64,linux/arm64 \
            --template "${repo}:${tag}-ARCH" \
            --target "${repo}:${tag}"

          # A release adds its version tag and leaves latest alone.
          if [ -n "${VERSION:-}" ]; then
            skopeo --insecure-policy copy --all \
              "docker://${repo}:${tag}" "docker://${repo}:${VERSION}"
            echo "== ${repo}:${tag} is multi-arch (amd64 + arm64); ${VERSION} -> it =="
            exit 0
          fi

          # `latest` tracks main's current content; a registry-side copy, no rebuild.
          skopeo --insecure-policy copy --all \
            "docker://${repo}:${tag}" "docker://${repo}:latest"
          echo "== ${repo}:${tag} is multi-arch (amd64 + arm64); latest -> it =="

  # Imageless releases: each rootfs goes to the scooter cachix (the cachix action
  # pushes what the job builds), each placeholder to ghcr, and the content-addressed
  # catalog to the imageless-catalog branch, which nodes read over HTTPS.
  imageless:
    name: imageless releases (x86_64-linux)
    # Releases only republish existing catalog entries; main alone appends.
    if: ${{ !inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the imageless-catalog branch
      packages: write
    env:
      CONTAINERS_REGISTRIES_CONF: ${{ github.workspace }}/.registries.conf
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: neutralize the runner's v1 registries.conf
        run: 'touch "$CONTAINERS_REGISTRIES_CONF"'

      - name: install skopeo
        run: nix profile install nixpkgs#skopeo

      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Building it builds every rootfs, which the cachix action then pushes.
      - name: build rootfs closures + placeholders
        run: nix build .#imageless-publish .#imageless-catalog -o result

      - name: push placeholders
        run: |
          set -euo pipefail
          jq -c '.[]' result/push.json | while read -r entry; do
            attr=$(jq -r .attr <<<"$entry"); image=$(jq -r .image <<<"$entry")
            if skopeo inspect "docker://${image}" >/dev/null 2>&1; then
              echo "== ${image} already published =="; continue
            fi
            "result/${attr}.copyTo/bin/copy-to" "docker://${image}"
          done

      # Manifests are named by digest, so the branch only ever gains files.
      - name: publish the catalog
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git fetch origin imageless-catalog; then
            git worktree add catalog origin/imageless-catalog && git -C catalog switch -c imageless-catalog
          else
            git worktree add --orphan -b imageless-catalog catalog
          fi
          cp -rL --no-preserve=mode result-1/. catalog/
          git -C catalog add -A
          git -C catalog diff --cached --quiet && { echo "== catalog unchanged =="; exit 0; }
          git -C catalog commit -m "imageless releases for ${GITHUB_SHA}"
          git -C catalog push origin imageless-catalog
