name: Docs validation (PR check)

# Validate that mkdocs builds successfully on PRs, before merge. The actual deployment
# to GitHub Pages happens only on main (via docs.yml). This catches broken refs/config
# early without waiting for merge.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "modules/**"          # the option reference derives from these
      - "flake.nix"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: generate the option reference from the modules
        run: |
          nix build .#options-doc -o options-result
          SCOOTER_OPTIONS_JSON=options-result/share/doc/nixos/options.json \
            python3 docs/gen_options.py
          echo "generated $(ls docs/reference/options/*.md | wc -l) option pages"

      - name: validate mkdocs build
        run: |
          pip install mkdocs-material mkdocs-awesome-pages-plugin
          mkdocs build --strict
