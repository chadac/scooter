<!doctype html>
<!--
  Web app review: the conversation on the left, the app under review on the right with
  the review toolbar above it. The app is the review-app service on this same origin,
  so its route is mirrored in this page's address bar both ways.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B4%3C/text%3E%3C/svg%3E">
<script id="review-config" type="application/json">@CONFIG@</script>
<style>
  :root {
    color-scheme: light dark; --rail: 28px; --line: #d4d4d8; --muted: #71717a; --bg: #fafafa;
    --ink: #18181b; --accent: #db2777; --ok: #15803d; --unread: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --line: #3f3f46; --muted: #a1a1aa; --bg: #18181b; --ink: #f4f4f5; --accent: #f472b6; --ok: #4ade80; --unread: #60a5fa; }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  #layout { display: flex; height: 100%; }
  #chat { flex: none; width: var(--chat-width, 420px); min-width: 0; }
  #layout.collapsed #chat { width: 0; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: Canvas; }
  #rail {
    flex: none; width: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding-top: 8px; border-inline: 1px solid var(--line); cursor: col-resize; user-select: none;
  }
  #layout.collapsed #rail { cursor: default; }
  #rail button, #rail a {
    all: unset; cursor: pointer; width: 22px; height: 22px; display: grid; place-items: center;
    border-radius: 4px; color: var(--muted); font-size: 13px;
  }
  #rail button:hover, #rail a:hover { background: color-mix(in srgb, var(--muted) 18%, transparent); color: CanvasText; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #layout.dragging iframe { pointer-events: none; }
  #missing { padding: 16px; color: var(--muted); }

  #bar { user-select: none;
    flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px; min-height: 30px;
    border-bottom: 1px solid var(--line); position: relative;
  }
  #bar button {
    font: inherit; color: inherit; background: none; border: 1px solid transparent; border-radius: 6px;
    padding: 3px 8px; cursor: pointer; display: inline-flex; gap: 4px; align-items: center;
  }
  #bar button:hover { background: color-mix(in srgb, var(--muted) 15%, transparent); }
  #bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #bar kbd { font: 10px ui-monospace, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  #bar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
  #route { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-family: ui-monospace, monospace; padding-left: 8px; }

  #pins-n:empty, #pins-unread:empty { display: none; }
  #pins-unread { background: var(--unread); color: #fff; border-radius: 999px; padding: 0 5px; font-size: 10px; font-weight: 700; }
  #body { flex: 1; min-height: 0; display: flex; }
  #app { flex: 1; min-width: 0; }

  #side { flex: none; width: 320px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--bg); }
  #side[hidden] { display: none; }
  #side header { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); }
  #side header b { flex: 1; }
  #side header button { all: unset; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
  #side header button:hover { background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--ink); }
  #filter { display: flex; margin: 8px 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #filter button { all: unset; flex: 1; text-align: center; padding: 4px 0; cursor: pointer; color: var(--muted); }
  #filter button + button { border-left: 1px solid var(--line); }
  #filter button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 600; }
  #list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  #list li { padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; }
  #list li:hover { background: color-mix(in srgb, var(--muted) 10%, transparent); }
  #list li.here { box-shadow: inset 2px 0 var(--accent); }
  #list .badge { grid-row: span 3; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); position: relative; }
  #list .resolved .badge { background: var(--ok); }
  #list .unread .badge::after { content: ""; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--unread); border: 2px solid var(--bg); }
  #list .meta { color: var(--muted); font-size: 11px; display: flex; gap: 6px; min-width: 0; }
  #list .meta .route { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; }
  #list .text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #list .resolved .text { color: var(--muted); }
  #list .last { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .unread .text, #list .unread .last { font-weight: 600; color: var(--ink); }
  #list .empty { display: block; padding: 16px 12px; color: var(--muted); border: 0; cursor: default; }
</style>
</head>
<body>
<div id="layout">
  <div id="chat"></div>
  <div id="rail" title="Drag to resize the chat">
    <button id="toggle" type="button" aria-label="Hide chat" title="Hide chat">‹</button>
    <a id="conv" target="_blank" rel="noopener" aria-label="Open in Scooter" title="Open in Scooter">🛴</a>
    <a id="full" href="@APP_BASE@/" target="_blank" rel="noopener" aria-label="Open the app on its own" title="Open the app on its own">⤢</a>
  </div>
  <div id="main">
    <div id="bar" role="toolbar" aria-label="Review">
      <button id="point" type="button" aria-pressed="false" title="Comment on an element (C)">◎ Point <kbd>C</kbd></button>
      <button id="area" type="button" aria-pressed="false" title="Comment on an area (R)">▭ Area <kbd>R</kbd></button>
      <span class="sep"></span>
      <span id="route" title="The app's route"></span>
      <button id="hide" type="button" aria-pressed="false" title="Hide pins (H)">Hide pins</button>
      <button id="reload" type="button" title="Reload the app">⟳</button>
      <button id="pins" type="button" aria-pressed="false" aria-controls="side" title="All pins (P)">Pins <span id="pins-n"></span><span id="pins-unread" title="Unread"></span></button>
    </div>
    <div id="body">
      <div id="app"><iframe id="frame" title="App under review" allow="clipboard-read; clipboard-write; fullscreen"></iframe></div>
      <aside id="side" aria-label="All pins" hidden>
        <header><b>Pins</b><button id="side-close" type="button" aria-label="Close" title="Close (P)">✕</button></header>
        <div id="filter" role="group" aria-label="Show">
          <button type="button" data-filter="open" aria-pressed="true">Open <span></span></button>
          <button type="button" data-filter="closed" aria-pressed="false">Closed <span></span></button>
          <button type="button" data-filter="all" aria-pressed="false">All <span></span></button>
        </div>
        <ol id="list"></ol>
      </aside>
    </div>
  </div>
</div>
<script>
"use strict";
const CFG = JSON.parse(document.getElementById("review-config").textContent);
const API = CFG.appBase + "/__review/";
const $ = (id) => document.getElementById(id);
const layout = $("layout"), chat = $("chat"), rail = $("rail"), toggle = $("toggle"), frame = $("frame");

// --- chat pane, as in "marimo + chat" -------------------------------------------
if (CFG.chatUrl) {
  const f = document.createElement("iframe");
  f.title = "Scooter chat";
  f.src = CFG.chatUrl;
  f.allow = "clipboard-read; clipboard-write";
  chat.append(f);
} else {
  chat.innerHTML = '<p id="missing">No chat URL: this sandbox has no CONVERSATION_URL.</p>';
}
if (CFG.convUrl) $("conv").href = CFG.convUrl;
else $("conv").hidden = true;
const KEY_W = "scooter.review.chatWidth", KEY_C = "scooter.review.chatCollapsed";
const clamp = (w) => Math.max(260, Math.min(w, window.innerWidth - 360));
const setWidth = (w) => layout.style.setProperty("--chat-width", clamp(w) + "px");
const setCollapsed = (c) => {
  layout.classList.toggle("collapsed", c);
  toggle.textContent = c ? "›" : "‹";
  toggle.title = toggle.ariaLabel = c ? "Show chat" : "Hide chat";
  localStorage.setItem(KEY_C, c ? "1" : "0");
};
setWidth(Number(localStorage.getItem(KEY_W)) || 420);
setCollapsed(localStorage.getItem(KEY_C) === "1");
toggle.addEventListener("click", () => setCollapsed(!layout.classList.contains("collapsed")));
rail.addEventListener("pointerdown", (e) => {
  if (e.target !== rail || layout.classList.contains("collapsed")) return;
  rail.setPointerCapture(e.pointerId);
  layout.classList.add("dragging");
});
rail.addEventListener("pointermove", (e) => {
  if (layout.classList.contains("dragging")) setWidth(e.clientX - chat.getBoundingClientRect().left);
});
const endDrag = () => {
  if (!layout.classList.contains("dragging")) return;
  layout.classList.remove("dragging");
  localStorage.setItem(KEY_W, String(parseInt(getComputedStyle(chat).width, 10)));
};
rail.addEventListener("pointerup", endDrag);
rail.addEventListener("pointercancel", endDrag);

// --- the app frame and the address bar ------------------------------------------
// The path after this page's base is the app's route.
const routeOf = (loc) => (loc.pathname.slice(CFG.shellBase.length) || "/") + loc.search + loc.hash;
frame.src = CFG.appBase + routeOf(location);

function showRoute(route, title) {
  const next = CFG.shellBase + (route.startsWith("/") ? route : "/" + route);
  // replaceState only: the frame's pushes make the Back entries.
  if (next !== location.pathname + location.search + location.hash) history.replaceState(null, "", next);
  $("route").textContent = route;
  $("full").href = CFG.appBase + route;
  if (title !== undefined) document.title = (title ? title + " · " : "") + "Review";
  renderList();
}

// Without the overlay (non-HTML, errors), read the frame directly.
frame.addEventListener("load", () => {
  try {
    const loc = frame.contentWindow.location;
    if (loc.origin === location.origin && loc.pathname.startsWith(CFG.appBase)) {
      showRoute((loc.pathname.slice(CFG.appBase.length) || "/") + loc.search + loc.hash, frame.contentDocument.title);
    }
  } catch { /* left the origin */ }
  post({ type: "review:mode", mode });
  post({ type: "review:hide", hide });
});

const post = (msg) => frame.contentWindow && frame.contentWindow.postMessage(msg, location.origin);

// --- review state -----------------------------------------------------------------
let mode = null, hide = false, state = { notes: [] }, currentRoute = "/";

function setMode(m) {
  mode = mode === m ? null : m;
  $("point").ariaPressed = String(mode === "point");
  $("area").ariaPressed = String(mode === "area");
  post({ type: "review:mode", mode });
  if (mode) frame.focus();
}
function setHide(h) {
  hide = h;
  $("hide").ariaPressed = String(hide);
  post({ type: "review:hide", hide });
}

$("point").addEventListener("click", () => setMode("point"));
$("area").addEventListener("click", () => setMode("area"));
$("hide").addEventListener("click", () => setHide(!hide));
$("reload").addEventListener("click", () => frame.contentWindow.location.reload());
const KEY_SIDE = "scooter.review.pinsOpen", KEY_FILTER = "scooter.review.pinsFilter";
let filter = localStorage.getItem(KEY_FILTER) || "open";
function setSide(open) {
  $("side").hidden = !open;
  $("pins").ariaPressed = String(open);
  localStorage.setItem(KEY_SIDE, open ? "1" : "0");
}
setSide(localStorage.getItem(KEY_SIDE) === "1");
$("pins").addEventListener("click", () => setSide($("side").hidden));
$("side-close").addEventListener("click", () => setSide(false));
for (const b of document.querySelectorAll("#filter button")) {
  b.addEventListener("click", () => {
    filter = b.dataset.filter;
    localStorage.setItem(KEY_FILTER, filter);
    renderList();
  });
}

function onKey(key) {
  if (key === "c") setMode("point");
  else if (key === "r") setMode("area");
  else if (key === "h") setHide(!hide);
  else if (key === "p") setSide($("side").hidden);
  else if (key === "escape") mode ? setMode(mode) : post({ type: "review:escape" });
}
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]")) return;
  onKey(e.key.toLowerCase());
});

async function api(path, body) {
  const r = await fetch(API + path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "content-type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

const pathOf = (route) => route.split(/[?#]/)[0];
// Scooter changed the note since the user last opened it.
const isUnread = (n) => !!n.agentAt && (!n.readAt || Date.parse(n.agentAt) > Date.parse(n.readAt));
function renderList() {
  const notes = state.notes;
  const open = notes.filter((n) => !n.resolved);
  const unread = notes.filter(isUnread).length;
  const counts = { open: open.length, closed: notes.length - open.length, all: notes.length };
  $("pins-n").textContent = open.length ? `(${open.length})` : "";
  $("pins-unread").textContent = unread || "";
  for (const b of document.querySelectorAll("#filter button")) {
    b.ariaPressed = String(b.dataset.filter === filter);
    b.querySelector("span").textContent = counts[b.dataset.filter];
  }
  const shown = notes.filter((n) => filter === "all" || (filter === "open") !== !!n.resolved);
  const list = $("list");
  list.replaceChildren();
  if (!shown.length) {
    list.innerHTML = notes.length ? `<li class="empty">No ${filter} pins.</li>`
      : '<li class="empty">No pins yet. Press <kbd>C</kbd> or <kbd>R</kbd> and click the app.</li>';
  }
  for (const n of shown) {
    const li = document.createElement("li");
    const here = pathOf(n.route) === pathOf(currentRoute);
    li.className = [n.resolved && "resolved", isUnread(n) && "unread", here && "here"].filter(Boolean).join(" ");
    li.dataset.id = n.id;
    li.innerHTML = `<span class="badge"></span><div class="meta"><b></b><span></span><span class="route"></span></div><div class="text"></div><div class="last"></div>`;
    li.querySelector(".badge").textContent = n.resolved ? "✓" : n.num;
    li.querySelector(".meta b").textContent = `#${n.num}`;
    li.querySelector(".meta span").textContent = n.kind;
    li.querySelector(".route").textContent = here ? "this page" : n.route;
    li.querySelector(".text").textContent = n.thread[0]?.text ?? "";
    const last = n.thread.length > 1 ? n.thread[n.thread.length - 1] : null;
    if (last) li.querySelector(".last").textContent = `${last.by === "agent" ? "Scooter" : "You"}: ${last.text}`;
    else li.querySelector(".last").remove();
    li.title = isUnread(n) ? "Unread: Scooter updated this note" : "";
    li.addEventListener("click", () => {
      if (hide) setHide(false);
      post({ type: "review:open", id: n.id, route: n.route });
    });
    list.append(li);
  }
}

function connect() {
  const es = new EventSource(API + "events?role=shell");
  es.addEventListener("notes", (e) => { state = JSON.parse(e.data); renderList(); });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();

// --- messages from the overlay in the frame ----------------------------------------
addEventListener("message", async (e) => {
  if (e.origin !== location.origin || e.source !== frame.contentWindow || !e.data || typeof e.data.type !== "string") return;
  const m = e.data;
  if (m.type === "review:route") { currentRoute = m.route; showRoute(m.route, m.title); }
  else if (m.type === "review:mode") { mode = m.mode; $("point").ariaPressed = String(mode === "point"); $("area").ariaPressed = String(mode === "area"); }
  else if (m.type === "review:key") onKey(m.key);
  else if (m.type === "review:exact") {
    try { post({ type: "review:exact-result", id: m.id, shot: await exactCapture(m.rect) }); }
    catch (err) { post({ type: "review:exact-result", id: m.id, error: String(err.message || err) }); }
  }
});

// Pixel-exact capture of a frame rectangle via screen capture.
async function exactCapture(rect) {
  const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" }, preferCurrentTab: true, audio: false });
  try {
    const [track] = stream.getVideoTracks();
    if (window.CropTarget && track.cropTo) await track.cropTo(await CropTarget.fromElement(frame));
    const video = document.createElement("video");
    video.srcObject = stream;
    video.muted = true;
    await video.play();
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const cropped = !!(window.CropTarget && track.cropTo);
    const host = cropped ? { left: 0, top: 0, width: frame.clientWidth } : frame.getBoundingClientRect();
    const viewW = cropped ? host.width : window.innerWidth;
    const scale = video.videoWidth / viewW;
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(rect.w * scale);
    canvas.height = Math.round(rect.h * scale);
    canvas.getContext("2d").drawImage(video, (host.left + rect.x) * scale, (host.top + rect.y) * scale,
      rect.w * scale, rect.h * scale, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/png");
  } finally {
    stream.getTracks().forEach((t) => t.stop());
  }
}
</script>
</body>
</html>
