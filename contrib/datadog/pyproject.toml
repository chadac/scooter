[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scooter-contrib-datadog"
version = "0.0.0"
license = "MIT"
description = "Datadog integration for Scooter's broker — proxies /datadog/* with the two Datadog keys injected"
requires-python = ">=3.11"
# Depends on the extension SURFACE, never on the broker app. Why: PR #567.
dependencies = [
  "fastapi",
]

# One EXTRA per service. Why: PR #567.
[project.optional-dependencies]
broker = ["scooter-broker-lib", "scooter-lib"]

[project.entry-points."agent_broker.providers"]
datadog = "scooter_contrib_datadog.broker_provider:datadog"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
